<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Z-Chat</title>

<style>
:root {
  --primary: #25d366;
  --bg-dark: #0b141a;
  --panel: rgba(32, 44, 51, 0.94);
  --sent: #005c4b;
  --received: #202c33;
  --glass: rgba(255, 255, 255, 0.07);
  --danger: #ff4d4d;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-dark);
  color: white;
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
}

/* Custom Scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
::-webkit-scrollbar-thumb { background: rgba(37, 211, 102, 0.4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--primary); }

#canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

.app { position: relative; height: 100vh; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; padding: 12px; }

/* Modern Glassmorphic UI & Neon Green Glow Borders */
.card, #chatScreen, .call-card, .requests-card {
  background: var(--panel);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 2rem;
  border-radius: 18px;
  border: 1px solid rgba(37, 211, 102, 0.3);
  box-shadow: 0 0 20px rgba(37, 211, 102, 0.15), 0 12px 40px rgba(0,0,0,0.5);
}

.card { width: 100%; max-width: 400px; }

#chatScreen { display: none; width: 100%; max-width: 900px; height: 96vh; height: 96dvh; border-radius: 18px; flex-direction: column; overflow: hidden; box-shadow: 0 0 25px rgba(37, 211, 102, 0.2), 0 14px 50px rgba(0,0,0,0.7); }

.header { padding: 12px 18px; background: rgba(0,0,0,0.4); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--glass); }
.header-info { display: flex; flex-direction: column; cursor: pointer; }
.header-btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.header-btns button { background: none; border: 1px solid var(--glass); color: #ccc; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
.header-btns button:hover { color: white; background: var(--glass); border-color: var(--primary); }

.status-indicator { font-size: 0.75rem; color: #aaa; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #777; }
.status-dot.online { background: var(--primary); box-shadow: 0 0 6px var(--primary); }

/* Top Action Bar for Clean Header Integration */
.top-action-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  position: relative;
}

.icon-action-btn {
  background: var(--glass);
  border: 1px solid var(--glass);
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: 0.2s;
}
.icon-action-btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }

.dropdown-menu {
  display: none;
  position: absolute;
  top: 40px;
  right: 0;
  background: var(--panel);
  border: 1px solid var(--glass);
  border-radius: 12px;
  min-width: 160px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  backdrop-filter: blur(18px);
  z-index: 500;
  overflow: hidden;
}

.dropdown-menu.active {
  display: flex;
  flex-direction: column;
}

.dropdown-item {
  padding: 10px 14px;
  background: none;
  border: none;
  color: white;
  text-align: left;
  cursor: pointer;
  font-size: 0.85rem;
  width: 100%;
  border-bottom: 1px solid var(--glass);
  transition: background 0.2s;
}
.dropdown-item:last-child { border-bottom: none; }
.dropdown-item:hover { background: rgba(255,255,255,0.1); }
.dropdown-item.danger { color: var(--danger); }

/* Modals */
.confirm-modal, .call-modal, .requests-modal, .info-modal, .media-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  z-index: 2000;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.media-modal {
  background: rgba(0, 0, 0, 0.95);
  z-index: 3000;
  flex-direction: column;
}

.media-modal-content {
  max-width: 90vw;
  max-height: 85vh;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

.media-modal-close {
  position: absolute;
  top: 20px;
  right: 25px;
  background: var(--glass);
  color: white;
  border: 1px solid var(--glass);
  font-size: 1.2rem;
  padding: 8px 14px;
  border-radius: 50%;
  cursor: pointer;
}

.call-card {
  padding: 2rem;
  border-radius: 20px;
  text-align: center;
  width: 100%;
  max-width: 450px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

.video-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  width: 100%;
  max-height: 320px;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}
.video-grid video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #111;
  display: none;
}
.video-grid video.active { display: block; }

/* Control Panels */
#adminGroupPanel, #adminMemberPanel {
  display: none;
  padding: 10px 18px;
  background: rgba(37, 211, 102, 0.08);
  border-bottom: 1px solid rgba(37, 211, 102, 0.15);
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
#adminMemberPanel { background: rgba(37, 211, 102, 0.04); }
#adminGroupPanel input, #adminMemberPanel input {
  flex: 1;
  min-width: 140px;
  padding: 8px 12px;
  font-size: 0.9rem;
}

/* Search Bar & Requests */
.search-bar-container { padding: 12px 18px; background: rgba(0,0,0,0.25); display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--glass); position: relative; }
.search-bar-container input { flex: 1; padding: 9px 14px; font-size: 0.9rem; }
.requests-badge-btn { position: relative; background: var(--glass); border: 1px solid var(--glass); color: white; padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
.badge-count { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 50%; display: none; }

.chat-filter-container { padding: 6px 18px; background: rgba(0,0,0,0.15); border-bottom: 1px solid var(--glass); display: none; }
.chat-filter-container input { width: 100%; padding: 6px 10px; font-size: 0.8rem; }

#userList { display: flex; padding: 10px 18px; gap: 10px; overflow-x: auto; border-bottom: 1px solid var(--glass); background: rgba(0,0,0,0.15); flex-shrink: 0; }
.user-chip { position: relative; padding: 8px 16px; background: var(--glass); border-radius: 20px; cursor: pointer; white-space: nowrap; transition: 0.3s; border: 1px solid transparent; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
.user-chip.active { background: var(--primary); color: black; font-weight: bold; border-color: var(--primary); box-shadow: 0 0 10px rgba(37, 211, 102, 0.4); }
.chip-dot { width: 6px; height: 6px; border-radius: 50%; background: #777; }
.chip-dot.online { background: #00ff66; }

.unread-arrow-badge {
  background: var(--danger);
  color: white;
  font-size: 0.7rem;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-left: 4px;
}

/* Suggestions Dropdown */
#searchSuggestions { display: none; position: absolute; top: 65px; left: 18px; right: 18px; background: var(--panel); border: 1px solid var(--glass); border-radius: 10px; z-index: 100; max-height: 220px; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,0.6); backdrop-filter: blur(18px); }
.suggestion-item { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass); font-size: 0.9rem; }
.suggestion-item:hover { background: rgba(255,255,255,0.08); }

#messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }

/* Micro-animations for message entry */
@keyframes bubbleEntry {
  from { opacity: 0; transform: translateY(12px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.bubble { max-width: 82%; padding: 10px 14px; border-radius: 12px; position: relative; font-size: 0.95rem; line-height: 1.4; word-break: break-word; user-select: none; cursor: pointer; animation: bubbleEntry 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.bubble.sent { align-self: flex-end; background: var(--sent); border-bottom-right-radius: 2px; border: 1px solid rgba(37, 211, 102, 0.2); }
.bubble.received { align-self: flex-start; background: var(--received); border-bottom-left-radius: 2px; }
.bubble img, .bubble video { border-radius: 8px; margin-top: 5px; display: block; border: 1px solid rgba(255,255,255,0.1); width: 220px; height: 160px; object-fit: cover; cursor: pointer; transition: transform 0.2s; }
.bubble img:hover, .bubble video:hover { opacity: 0.9; }
.bubble audio { margin-top: 5px; width: 100%; min-width: 220px; }
.meta { font-size: 0.7rem; opacity: 0.65; text-align: right; margin-top: 4px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
.seen-status { font-weight: bold; color: #4dc3ff; }

.msg-actions-inline { display: inline-flex; gap: 6px; margin-left: 6px; font-size: 0.7rem; }
.msg-action-link { color: #a3f1c0; cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; font-size: 0.7rem; }
.msg-action-link.danger { color: #ff8080; }

.reply-quote { background: rgba(0,0,0,0.3); border-left: 3px solid var(--primary); padding: 5px 10px; border-radius: 4px; font-size: 0.85rem; margin-bottom: 6px; opacity: 0.9; }
.reply-preview-bar { display: none; padding: 8px 16px; background: rgba(0,0,0,0.4); border-top: 1px solid var(--glass); align-items: center; justify-content: space-between; font-size: 0.85rem; }

.reactions-container { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.reaction-badge { background: rgba(0,0,0,0.45); border: 1px solid var(--glass); border-radius: 12px; padding: 2px 8px; font-size: 0.8rem; display: flex; align-items: center; gap: 3px; }

#emojiTray { display: none; position: absolute; bottom: 75px; left: 18px; background: var(--panel); border: 1px solid var(--glass); padding: 12px; border-radius: 14px; backdrop-filter: blur(18px); grid-template-columns: repeat(6, 1fr); gap: 8px; z-index: 10; box-shadow: 0 6px 25px rgba(0,0,0,0.7); }
.emoji-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; padding: 4px; border-radius: 6px; }
.emoji-btn:hover { background: var(--glass); }

.inputBar { padding: 12px 18px; background: rgba(0,0,0,0.4); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: relative; border-top: 1px solid rgba(37, 211, 102, 0.2); }
input { background: rgba(0,0,0,0.35); border: 1px solid var(--glass); color: white; padding: 10px 12px; border-radius: 8px; outline: none; font-size: 0.95rem; transition: border-color 0.2s; }
input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(37, 211, 102, 0.25); }
#messageInput { flex: 1; min-width: 140px; }

.media-actions { display: flex; gap: 6px; align-items: center; }
.action-btn { background: var(--glass); border: 1px solid var(--glass); color: white; padding: 10px 14px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
.action-btn:hover { background: rgba(255,255,255,0.15); border-color: var(--primary); }
.action-btn.recording { background: var(--danger); animation: pulse 1.2s infinite; }

@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

button { background: var(--primary); border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; transition: transform 0.1s, box-shadow 0.2s; }
button:hover { box-shadow: 0 0 10px rgba(37, 211, 102, 0.5); }
button:active { transform: scale(0.97); }

.input-group { display: flex; flex-direction: column; gap: 12px; }

.custom-alert { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; background: var(--primary); color: black; font-weight: bold; z-index: 3000; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; max-width: 90%; }
.custom-alert.error { background: var(--danger); color: white; }

.requests-card { background: var(--panel); padding: 1.5rem; border-radius: 16px; width: 100%; max-width: 360px; border: 1px solid var(--glass); max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
.request-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--glass); font-size: 0.9rem; }

.device-accounts-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
.device-account-chip { display: flex; justify-content: space-between; align-items: center; background: var(--glass); padding: 8px 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
.device-account-chip:hover { border-color: var(--primary); }

@media (max-width: 600px) {
  .app { padding: 0; justify-content: flex-start; }
  #chatScreen { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; border: none; margin: 0; }
  .card { width: 92%; padding: 1.5rem; }
  .inputBar { padding: 8px 12px; }
  .header-btns button, .icon-action-btn { padding: 5px 8px; font-size: 0.75rem; }
}
</style>
</head>

<body>

<div id="canvas-container"></div>
<div id="customAlert" class="custom-alert"></div>

<div id="mediaModal" class="media-modal">
  <button class="media-modal-close" id="mediaModalCloseBtn">✕</button>
  <div id="mediaModalContainer" style="display:flex; align-items:center; justify-content:center; width:100%; height:100%;"></div>
</div>

<div id="confirmModal" class="confirm-modal">
  <div class="card" style="text-align: center; max-width: 320px;">
    <h3 style="margin-top: 0; color: var(--danger);">Confirm Action</h3>
    <p id="confirmMessage" style="font-size: 0.95rem; line-height: 1.4; color: #eee; margin-bottom: 20px;"></p>
    <div style="display: flex; gap: 10px; justify-content: center;">
      <button id="confirmYesBtn" style="background: var(--danger); color: white; flex: 1;">Yes</button>
      <button id="confirmNoBtn" style="background: var(--glass); color: white; flex: 1;">Cancel</button>
    </div>
  </div>
</div>

<div id="requestsModal" class="requests-modal">
  <div class="requests-card">
    <h3 style="margin-top:0; color:var(--primary)">Friend Requests</h3>
    <div id="requestsList" style="display:flex; flex-direction:column; gap:10px; margin: 15px 0;"></div>
    <button id="closeRequestsModal" style="width:100%; background:var(--glass); color:white;">Close</button>
  </div>
</div>

<div id="groupInfoModal" class="info-modal">
  <div class="requests-card">
    <h3 id="groupInfoTitle" style="margin-top:0; color:var(--primary)">Group Members</h3>
    <div id="groupMembersList" style="display:flex; flex-direction:column; gap:8px; margin: 15px 0; max-height:220px; overflow-y:auto;"></div>
    <div style="display:flex; gap:8px;">
      <button id="renameGroupBtn" style="flex:1; background:var(--glass); color:white; font-size:0.85rem; display:none;">Rename Group</button>
      <button id="closeGroupInfoModal" style="flex:1; background:var(--primary); color:black; font-size:0.85rem;">Close</button>
    </div>
  </div>
</div>

<div id="callModal" class="call-modal">
  <div class="call-card">
    <h3 id="callTitle" style="margin: 0; color: var(--primary);">Incoming Call</h3>
    <p id="callStatusText" style="margin: 0; font-size: 0.9rem; color: #ccc;">Connecting...</p>
    <div class="video-grid" id="videoGridContainer">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted style="width: 100px; height: 75px; position: absolute; bottom: 10px; right: 10px; border-radius: 6px; border: 1px solid #fff;"></video>
    </div>
    <div style="display: flex; gap: 8px; width: 100%; justify-content: center; flex-wrap: wrap;" id="callActionButtons">
      <button id="acceptCallBtn" style="background: var(--primary); display: none; flex: 1;">Accept</button>
      <button id="toggleMicBtn" style="background: var(--glass); color: white; flex: 1; display: none;">Mute Mic</button>
      <button id="toggleCamBtn" style="background: var(--glass); color: white; flex: 1; display: none;">Cam Off</button>
      <button id="endCallBtn" style="background: var(--danger); color: white; flex: 1;">End Call</button>
    </div>
  </div>
</div>

<div class="app">
  <div id="loginScreen">
    <div class="card">
      <h2 style="margin-top:0; color:var(--primary); text-align:center;">Z-Chat</h2>
      
      <div id="deviceAccountSection" style="display:none; margin-bottom: 15px;">
        <div style="font-size:0.8rem; color:#aaa; margin-bottom:6px;">Accounts on this device (<span id="deviceCountLabel">0</span>/3):</div>
        <div id="deviceAccountsList" class="device-accounts-list"></div>
        <button id="addNewAccountBtn" style="width:100%; background:var(--glass); color:white; font-size:0.85rem; margin-bottom:10px; display:none;">+ Add Another Account</button>
      </div>

      <div id="authFormContainer">
        <div class="input-group">
          <input id="username" placeholder="Username">
          <input id="password" type="password" placeholder="Password">
        </div>
        <button id="authActionBtn" style="width:100%; margin-top:12px;">Log In</button>
      </div>
    </div>
  </div>

  <div id="chatScreen" style="position:relative;">
    <div class="header">
      <div class="header-info" id="chatHeaderClickable" title="Click for info / rename">
        <div id="ownerDisplayLabel" style="font-size: 0.75rem; color: var(--primary); font-weight: bold;">Owner: <span id="ownerNameSpan"></span></div>
        <div id="chatTitle" style="font-weight:bold; font-size:1.1rem;">Z-Chat Direct</div>
        <div class="status-indicator" id="chatStatusIndicator">
          <span class="status-dot" id="headerStatusDot"></span>
          <span id="headerStatusText">Select a chat</span>
        </div>
      </div>
      
      <!-- Upgraded Header Buttons using Settings, Chats, Profiles dropdown/top controls -->
      <div class="header-btns">
        <button id="voiceCallBtn" title="Voice Call" style="display:none;">📞 Call</button>
        <button id="videoCallBtn" title="Video Call" style="display:none;">📹 Video</button>
        <button id="toggleFilterBtn" title="Search Chat Messages" style="background: var(--glass); color: white;">🔍 Chat Filter</button>
        
        <!-- Settings Dropdown Container -->
        <div class="top-action-bar">
          <button id="settingsMenuBtn" class="icon-action-btn" title="Settings">⚙️ Settings</button>
          <div id="settingsDropdown" class="dropdown-menu">
            <button id="blockUserBtn" class="dropdown-item" style="display: none;">Block User</button>
            <button id="deleteGroupBtn" class="dropdown-item danger" style="display: none;">Disband Group</button>
            <button id="unfriendBtn" class="dropdown-item danger" style="display: none;">Unfriend</button>
            <button id="deleteChatBtn" class="dropdown-item">Clear Chat</button>
          </div>
        </div>

        <!-- Profiles Dropdown Container -->
        <div class="top-action-bar">
          <button id="profileMenuBtn" class="icon-action-btn" title="Profile Options">👤 Profile</button>
          <div id="profileDropdown" class="dropdown-menu">
            <button id="renameProfileBtn" class="dropdown-item">Rename Profile</button>
            <button id="logoutBtn" class="dropdown-item">Log Out</button>
            <button id="deleteProfileBtn" class="dropdown-item danger">Delete Account</button>
          </div>
        </div>

        <!-- Three Dots Chats Options Dropdown Container -->
        <div class="top-action-bar">
          <button id="threeDotsMenuBtn" class="icon-action-btn" title="Chat Actions">⋮</button>
          <div id="threeDotsDropdown" class="dropdown-menu">
            <button id="chatActionInfo" class="dropdown-item" onclick="document.getElementById('chatHeaderClickable').click()">View Details</button>
          </div>
        </div>
      </div>
    </div>

    <!-- In-Chat Message Search Filter Bar -->
    <div id="chatFilterContainer" class="chat-filter-container">
      <input id="chatMessageFilterInput" placeholder="⚡ Search inside current chat window...">
    </div>

    <div id="adminGroupPanel" style="display: flex;">
      <input id="newGroupName" placeholder="New Group Name...">
      <button id="createGroupBtn">Create Group</button>
    </div>

    <div id="adminMemberPanel">
      <span id="memberPanelLabel" style="font-size: 0.8rem; color: #aaa; white-space: nowrap;">Add to <strong id="adminSelectedGroupName" style="color:var(--primary)">Group</strong>:</span>
      <input id="addMemberUsername" placeholder="Username...">
      <button id="addMemberBtn">Add</button>
    </div>

    <div class="search-bar-container">
      <input id="userSearchInput" placeholder="🔍 Search usernames to add...">
      <button id="requestsBtn" class="requests-badge-btn">Requests <span id="requestBadgeCount" class="badge-count">0</span></button>
      <div id="searchSuggestions"></div>
    </div>

    <div id="userList"></div>
    <div id="messages"></div>

    <div id="replyPreviewBar" class="reply-preview-bar">
      <span id="replyPreviewText">Replying to message...</span>
      <button id="cancelReplyBtn" style="background: none; border: none; color: #aaa; cursor: pointer; font-size: 1rem;">✕</button>
    </div>

    <div class="inputBar">
      <div id="emojiTray">
        <button class="emoji-btn" onclick="insertEmoji('😊')">😊</button>
        <button class="emoji-btn" onclick="insertEmoji('❤️')">❤️</button>
        <button class="emoji-btn" onclick="insertEmoji('🔥')">🔥</button>
        <button class="emoji-btn" onclick="insertEmoji('👍')">👍</button>
        <button class="emoji-btn" onclick="insertEmoji('🎉')">🎉</button>

let DEVICE_ID = "";
async function getSecureDeviceFingerprint() {
  const nav = window.navigator;
  const sc = window.screen;
  const rawProps = [
    nav.userAgent,
    nav.language,
    nav.hardwareConcurrency || 'unknown',
    nav.deviceMemory || 'unknown',
    sc.width,
    sc.height,
    sc.colorDepth,
    new Date().getTimezoneOffset()
  ].join('|||');

  const msgBuffer = new TextEncoder().encode(rawProps);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

const rateLimits = {};
function checkRateLimit(actionKey, limitMs) {
  const now = Date.now();
  if (rateLimits[actionKey] && now - rateLimits[actionKey] < limitMs) {
    return false;
  }
  rateLimits[actionKey] = now;
  return true;
}

const ALLOWED_MIME_TYPES = ["image/jpeg", "image/png", "image/webp", "image/gif", "video/mp4", "video/webm", "audio/webm", "audio/mp3", "audio/wav", "audio/ogg"];
const MAX_FILE_SIZE = 15 * 1024 * 1024;
const MAX_FILES_PER_MESSAGE = 5;

async function validateAndUploadFile(file) {
  if (file.size > MAX_FILE_SIZE) {
    throw new Error("File size exceeds the 15MB limit.");
  }
  if (!ALLOWED_MIME_TYPES.includes(file.type)) {
    throw new Error("Invalid file type or format not supported.");
  }
  return await uploadToCloudinary(file);
}

async function uploadToCloudinary(file) {
  const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`;
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);

  const res = await fetch(url, { method: "POST", body: formData });
  if (!res.ok) throw new Error("Upload failed");
  const data = await res.json();
  
  return { 
    url: data.secure_url, 
    public_id: data.public_id || extractPublicIdFromUrl(data.secure_url), 
    type: file.type 
  };
}

function extractPublicIdFromUrl(secureUrl) {
  try {
    const parts = secureUrl.split('/');
    const filenameWithExt = parts[parts.length - 1];
    const filename = filenameWithExt.substring(0, filenameWithExt.lastIndexOf('.'));
    const folderIndex = parts.indexOf('upload');
    if (folderIndex !== -1 && parts.length > folderIndex + 2) {
      const folderPath = parts.slice(folderIndex + 2, parts.length - 1).join('/');
      return folderPath ? `${folderPath}/${filename}` : filename;
    }
    return filename;
  } catch (e) {
    return '';
  }
}

async function queueCloudinaryDeletion(attachments) {
  if (!attachments || !Array.isArray(attachments)) return;
  for (const att of attachments) {
    if (att.public_id || att.url) {
      try {
        await addDoc(collection(db, "cloudinary_queue"), {
          public_id: att.public_id || extractPublicIdFromUrl(att.url),
          url: att.url,
          status: "pending",
          time: Date.now()
        });
      } catch (e) {}
    }
  }
}

    a.href = blobUrl;

};

const renameProfileBtn = document.getElementById("renameProfileBtn");
renameProfileBtn.onclick = async () => {
  const newName = prompt("Enter new username:", currentUser);
  if (!newName || newName.trim() === "" || newName === currentUser) return;
  const trimmed = newName.trim();

  try {
    const newRef = doc(db, "users", trimmed);
    const newSnap = await getDoc(newRef);
    if (newSnap.exists()) {
      return showAlert("Username already taken! Please choose another.", true);
    }

    const oldRef = doc(db, "users", currentUser);
    const oldSnap = await getDoc(oldRef);
    const userData = oldSnap.data() || {};

    await setDoc(newRef, userData);

    let accounts = getDeviceAccounts();
    if (accounts.includes(currentUser)) {
      accounts = accounts.map(acc => acc === currentUser ? trimmed : acc);
      localStorage.setItem(`zchat_device_accounts_${DEVICE_ID}`, JSON.stringify(accounts));
    }

    const usersSnap = await getDocs(collection(db, "users"));
    const groupsSnap = await getDocs(collection(db, "groups"));
    const messagesSnap = await getDocs(collection(db, "messages"));

    const updatePromises = [];

    usersSnap.forEach(userDoc => {
      if (userDoc.id === currentUser || userDoc.id === trimmed) return;
      const uData = userDoc.data();
      let modified = false;
      let friends = uData.friends || [];
      let requests = uData.requests || [];
      let blocked = uData.blocked || [];

      if (friends.includes(currentUser)) {
        friends = friends.map(f => f === currentUser ? trimmed : f);
        modified = true;
      }
      if (requests.includes(currentUser)) {
        requests = requests.map(r => r === currentUser ? trimmed : r);
        modified = true;
      }
      if (blocked.includes(currentUser)) {
        blocked = blocked.map(b => b === currentUser ? trimmed : b);
        modified = true;
      }

      if (modified) {
        updatePromises.push(updateDoc(doc(db, "users", userDoc.id), {
          friends: friends,
          requests: requests,
          blocked: blocked
        }));
      }
    });

    groupsSnap.forEach(groupDoc => {
      const gData = groupDoc.data();
      let gModified = false;
      let members = gData.members || [];
      let createdBy = gData.createdBy;

      if (members.includes(currentUser)) {
        members = members.map(m => m === currentUser ? trimmed : m);
        gModified = true;
      }
      if (createdBy === currentUser) {
        createdBy = trimmed;
        gModified = true;
      }

      if (gModified) {
        updatePromises.push(updateDoc(doc(db, "groups", groupDoc.id), {
          members: members,
          createdBy: createdBy
        }));
      }
    });

    messagesSnap.forEach(msgDoc => {
      const mData = msgDoc.data();
      let mModified = false;
      let updatePayload = {};

      if (mData.from === currentUser) {
        updatePayload.from = trimmed;
        mModified = true;
      }
      if (!mData.isGroup && mData.to === currentUser) {
        updatePayload.to = trimmed;
        mModified = true;
      }
      if (mData.replyTo && mData.replyTo.from === currentUser) {
        updatePayload.replyTo = { ...mData.replyTo, from: trimmed };
        mModified = true;
      }

      let seenBy = mData.seenBy || [];
      if (seenBy.includes(currentUser)) {
        updatePayload.seenBy = seenBy.map(s => s === currentUser ? trimmed : s);
        mModified = true;
      }

      if (mModified) {
        updatePromises.push(updateDoc(doc(db, "messages", msgDoc.id), updatePayload));
      }
    });

    await Promise.all(updatePromises);
    await deleteDoc(oldRef);

    currentUser = trimmed;
    currentChatUser = ""; 
    currentChatType = "user";
    messages.innerHTML = "";
    lastVisibleMessageDoc = null;
    olderMessagesAvailable = false;
    updateAdminPanels();
    renderList();
    updateHeaderStatus();
    initDeviceAccountsUI();
    showAlert("Profile renamed successfully!");
  } catch (e) {
    showAlert("Failed to rename profile", true);
  }
};

const deleteProfileBtn = document.getElementById("deleteProfileBtn");
deleteProfileBtn.onclick = async () => {
  showConfirm("Burn Profile? This will permanently delete your account, remove you from groups, and clear your records and media.", async () => {
    try {
      const targetUser = currentUser;

      await deleteDoc(doc(db, "users", targetUser));
      removeDeviceAccount(targetUser);

      const usersSnap = await getDocs(collection(db, "users"));
      const groupsSnap = await getDocs(collection(db, "groups"));
      const cleanupPromises = [];

      usersSnap.forEach(userDoc => {
        if (userDoc.id === targetUser) return;
        const uData = userDoc.data();
        let modified = false;
        let friends = uData.friends || [];
        let requests = uData.requests || [];
        let blocked = uData.blocked || [];

        if (friends.includes(targetUser)) {
          friends = friends.filter(f => f !== targetUser);
          modified = true;
        }
        if (requests.includes(targetUser)) {
          requests = requests.filter(r => r !== targetUser);
          modified = true;
        }
        if (blocked.includes(targetUser)) {
          blocked = blocked.filter(b => b !== targetUser);
          modified = true;
        }

        if (modified) {
          cleanupPromises.push(updateDoc(doc(db, "users", userDoc.id), {
            friends: friends,
            requests: requests,
            blocked: blocked
          }));
        }
      });

      groupsSnap.forEach(groupDoc => {
        const gData = groupDoc.data();
        let members = gData.members || [];
        let createdBy = gData.createdBy;
        let groupModified = false;

        if (members.includes(targetUser)) {
          members = members.filter(m => m !== targetUser);
          groupModified = true;
        }

        if (groupModified) {
          if (members.length === 0) {
            cleanupPromises.push(deleteDoc(doc(db, "groups", groupDoc.id)));
          } else {
            if (createdBy === targetUser) {
              createdBy = members[0];
            }
            cleanupPromises.push(updateDoc(doc(db, "groups", groupDoc.id), {
              members: members,
              createdBy: createdBy
            }));
          }
        }
      });

      const q = query(collection(db, "messages"), where("from", "==", targetUser));
      const snap = await getDocs(q);
      snap.forEach(docSnap => {
        const m = docSnap.data();
        if (m.attachments && Array.isArray(m.attachments)) {
          queueCloudinaryDeletion(m.attachments);
        }
        cleanupPromises.push(deleteDoc(doc(db, "messages", docSnap.id)));
      });

      await Promise.all(cleanupPromises);
      cleanupSessionListeners();
      currentUser = "";
      currentChatUser = "";
      currentChatType = "user";
      chatScreen.style.display = "none";
      loginScreen.style.display = "flex";
      initDeviceAccountsUI();
      showAlert("Account and associated data/media burned successfully.");
    } catch (e) {
      showAlert("Error burning profile", true);
    }
  });
};

window.sendFriendRequest = async (targetUser) => {
  if (!checkRateLimit("sendFriendRequest", 3000)) {
    return showAlert("Please wait before sending more friend requests.", true);
  }

  if (blockedUsers.includes(targetUser) || blockedByUsers.includes(targetUser)) {
    return showAlert("Cannot send friend request to a blocked user.", true);
  }

  try {
    const targetRef = doc(db, "users", targetUser);
    const snap = await getDoc(targetRef);
    if (snap.exists()) {
      const data = snap.data();
      const reqs = data.requests || [];
      const targetBlocked = data.blocked || [];
      if (targetBlocked.includes(currentUser)) {
        return showAlert("This user has blocked you.", true);
      }
      if (!reqs.includes(currentUser)) {
        reqs.push(currentUser);
        await updateDoc(targetRef, { requests: reqs });
        showAlert(`Friend request sent to @${targetUser}!`);
      } else {
        showAlert("Request already sent!");
      }
    }
    searchSuggestions.style.display = "none";
    userSearchInput.value = "";
  } catch (err) {
    showAlert("Failed to send request", true);

window.acceptRequest = async (fromUser) => {
  if (blockedUsers.includes(fromUser) || blockedByUsers.includes(fromUser)) {
    return showAlert("Cannot accept requests from blocked users.", true);
  }

  try {
    const myRef = doc(db, "users", currentUser);
    const mySnap = await getDoc(myRef);
    let myFriends = mySnap.data().friends || [];
    let myReqs = mySnap.data().requests || [];
    
    if (!myFriends.includes(fromUser)) myFriends.push(fromUser);
    myReqs = myReqs.filter(u => u !== fromUser);
    await updateDoc(myRef, { friends: myFriends, requests: myReqs });

    const otherRef = doc(db, "users", fromUser);
    const otherSnap = await getDoc(otherRef);
    if (otherSnap.exists()) {
      let otherFriends = otherSnap.data().friends || [];
      if (!otherFriends.includes(currentUser)) {
        otherFriends.push(currentUser);
        await updateDoc(otherRef, { friends: otherFriends });
      }
    }

    showAlert(`You are now friends with @${fromUser}!`);
    renderRequestsModal();
  } catch (e) {
    showAlert("Error accepting request", true);
  }
};

window.rejectRequest = async (fromUser) => {
  try {
    const myRef = doc(db, "users", currentUser);
    const mySnap = await getDoc(myRef);
    let myReqs = (mySnap.data().requests || []).filter(u => u !== fromUser);
    await updateDoc(myRef, { requests: myReqs });
    showAlert("Request rejected");
    renderRequestsModal();
  } catch (e) {
    showAlert("Error rejecting request", true);
  }
};

function loadDirectoryAndUserData() {
  globalDirectoryUnsubscribe = onSnapshot(collection(db, "users"), userSnap => {
    allUsersDirectory = [];
    userStatuses = {};
    const now = Date.now();
    userSnap.forEach(d => {
      const data = d.data();
      const isOnline = data.online && (now - (data.lastSeen || 0) < 35000);
      userStatuses[d.id] = { online: isOnline, lastSeen: data.lastSeen || 0 };
      allUsersDirectory.push(d.id);

      if (d.id === currentUser) {
        friendsList = data.friends || ["admin"];
        friendRequests = data.requests || [];
        blockedUsers = data.blocked || [];
        if (friendRequests.length > 0) {
          requestBadgeCount.style.display = "inline-block";
          requestBadgeCount.textContent = friendRequests.length;
        } else {
          requestBadgeCount.style.display = "none";
        }
      }
    });

    blockedByUsers = [];
    userSnap.forEach(d => {
      const data = d.data();
      const targetBlockedList = data.blocked || [];
      if (targetBlockedList.includes(currentUser)) {
        blockedByUsers.push(d.id);
      }
    });

    renderList();
    updateHeaderStatus();
    updateAdminPanels();
  });

  globalGroupsUnsubscribe = onSnapshot(collection(db, "groups"), groupSnap => {
    allGroups = [];
    groupSnap.forEach(d => {
      const groupData = d.data();
      const members = groupData.members || [];
      if (members.includes(currentUser) || groupData.createdBy === currentUser) {
        allGroups.push({ id: d.id, type: "group", members: members, createdBy: groupData.createdBy });
      }
    });
    renderList();
  });
}

function listenGlobalMessages() {
  globalMessagesUnsubscribe = onSnapshot(collection(db, "messages"), snap => {
    allMessagesCache = [];

    }

}

function updateHeaderStatus() {
  if (!currentChatUser) {
    headerStatusText.textContent = "Select a chat";
    headerStatusDot.className = "status-dot";
    return;
  }
  
  const isBlockedEitherWay = blockedUsers.includes(currentChatUser) || blockedByUsers.includes(currentChatUser);
  if (isBlockedEitherWay && currentChatType === "user") {
    headerStatusDot.className = "status-dot";
    headerStatusText.textContent = "Blocked / Unavailable";
    return;
  }

  if (currentChatType === "group") {
    headerStatusDot.className = "status-dot online";
    headerStatusText.textContent = "Group Chat (Click for info)";
  } else {
    const status = userStatuses[currentChatUser];
    if (status && status.online) {
      headerStatusDot.className = "status-dot online";
      headerStatusText.textContent = "Online";
    } else {
      headerStatusDot.className = "status-dot";
      if (status && status.lastSeen) {
        const diffMs = Date.now() - status.lastSeen;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMins / 60);
        const diffDays = Math.floor(diffHours / 24);

        let timeAgo = "";
        if (diffDays > 0) timeAgo = `${diffDays}d ago`;
        else if (diffHours > 0) timeAgo = `${diffHours}h ago`;
        else if (diffMins > 0) timeAgo = `${diffMins}m ago`;
        else timeAgo = "Just now";
        
        headerStatusText.textContent = `Last seen ${timeAgo}`;
      } else {
        headerStatusText.textContent = "Offline";
      }
    }
  }
}

function renderList() {
  userList.innerHTML = "";
  
  allGroups.forEach(g => {
    let unreadCount = 0;
    allMessagesCache.forEach(m => {
      if (m.isGroup && m.to === g.id && m.from !== currentUser) {
        const seenBy = m.seenBy || [];
        if (!seenBy.includes(currentUser)) unreadCount++;
      }
    });

    const chip = document.createElement("div");
    chip.className = "user-chip" + (currentChatUser === g.id && currentChatType === "group" ? " active" : "");
    let badgeHtml = unreadCount > 0 ? `<span class="unread-arrow-badge">↙ ${unreadCount}</span>` : "";
    chip.innerHTML = `👥 #${g.id} ${badgeHtml}`;
    chip.onclick = () => {
      if (activeMessagesUnsubscribe) { activeMessagesUnsubscribe(); activeMessagesUnsubscribe = null; }
      if (activeTypingUnsubscribe) { activeTypingUnsubscribe(); activeTypingUnsubscribe = null; }
      currentChatUser = g.id;
      currentChatType = "group";
      chatTitle.textContent = `#${g.id}`;
      updateAdminPanels();
      renderList(); 
      updateHeaderStatus();
      loadMessages();
      listenTypingStatus();
    };
    userList.appendChild(chip);
  });

  friendsList.forEach(friendId => {
    if (friendId === currentUser) return;
    const status = userStatuses[friendId] || { online: false };
    
    let unreadCount = 0;
    allMessagesCache.forEach(m => {
      if (!m.isGroup && m.from === friendId && m.to === currentUser) {
        const seenBy = m.seenBy || [];
        if (!seenBy.includes(currentUser)) unreadCount++;
      }
    });

    const chip = document.createElement("div");
    chip.className = "user-chip" + (currentChatUser === friendId && currentChatType === "user" ? " active" : "");
    let badgeHtml = unreadCount > 0 ? `<span class="unread-arrow-badge">↙ ${unreadCount}</span>` : "";
    chip.innerHTML = `<span class="chip-dot ${status.online ? 'online' : ''}"></span> @${friendId} ${badgeHtml}`;
    chip.onclick = () => {
      if (activeMessagesUnsubscribe) { activeMessagesUnsubscribe(); activeMessagesUnsubscribe = null; }
      if (activeTypingUnsubscribe) { activeTypingUnsubscribe(); activeTypingUnsubscribe = null; }
      currentChatUser = friendId;
      currentChatType = "user";
      chatTitle.textContent = `@${friendId}`;
      updateAdminPanels();
      renderList(); 
      updateHeaderStatus();
      loadMessages();
      listenTypingStatus();
    };
    userList.appendChild(chip);
  });
}

function listenTypingStatus() {
  if (!currentChatUser) return;
  if (activeTypingUnsubscribe) {
    activeTypingUnsubscribe();
    activeTypingUnsubscribe = null;
  }

  if (currentChatType === "group") {
    const typingQuery = query(collection(db, "typing"));
    activeTypingUnsubscribe = onSnapshot(typingQuery, snap => {
      let typingNames = [];
      const now = Date.now();
      snap.forEach(d => {
        const parts = d.id.split("_");
        if (parts.length === 2) {
          const fromUser = parts[0];
          const toTarget = parts[1];
          if (toTarget === currentChatUser && fromUser !== currentUser && d.data().isTyping && (now - d.data().time < 3000)) {
            typingNames.push(fromUser);
          }
        }
      });
      if (typingNames.length > 0) {
        headerStatusText.textContent = `${typingNames.join(", ")} typing...`;
      } else {
        updateHeaderStatus();
      }
    });
  } else {
    const typingRef = doc(db, "typing", `${currentChatUser}_${currentUser}`);
    activeTypingUnsubscribe = onSnapshot(typingRef, snap => {
      if (snap.exists() && snap.data().isTyping && (Date.now() - snap.data().time < 3000)) {
        headerStatusText.textContent = "typing...";
      } else {
        updateHeaderStatus();
      }
    });
  }
}

recordVoiceBtn.onclick = async () => {
  if (!checkRateLimit("recordVoice", 2000)) {
    return showAlert("Please wait before recording another voice note.", true);
  }

  if (blockedUsers.includes(currentChatUser) || blockedByUsers.includes(currentChatUser)) {
    return showAlert("Cannot send voice notes to a blocked user.", true);
  }

  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        stopMediaTracks(stream);
        if (recordedAudioBlob && currentChatUser) await sendAudioMessage(recordedAudioBlob);
      };

      mediaRecorder.start();
      isRecording = true;
      recordVoiceBtn.classList.add("recording");
      showAlert("Recording voice note...");
    } catch (err) {
      showAlert("Microphone unavailable", true);
    }
  } else {
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    isRecording = false;
    recordVoiceBtn.classList.remove("recording");
  }
};

async function sendAudioMessage(blob) {
  if (!currentChatUser) return;
  try {
    const audioFile = new File([blob], "voice_note.webm", { type: "audio/webm" });
    const uploadedAsset = await validateAndUploadFile(audioFile);

    await addDoc(collection(db, "messages"), {
      from: currentUser,
      to: currentChatUser,
      isGroup: currentChatType === "group",
      text: "",
      attachments: [uploadedAsset],
      time: Date.now(),
      seenBy: [currentUser],
      reactions: {},
      replyTo: null
    });
  } catch (err) {
    showAlert(err.message || "Failed to send voice note", true);
  }
}

const replyPreviewBar = document.getElementById("replyPreviewBar");
const replyPreviewText = document.getElementById("replyPreviewText");
document.getElementById("cancelReplyBtn").onclick = () => {
  activeReplyTo = null;
  replyPreviewBar.style.display = "none";
};

const sendBtn = document.getElementById("sendBtn");
sendBtn.onclick = async () => {
  if (!checkRateLimit("sendMessage", 1000)) {
    return showAlert("You are sending messages too fast. Please slow down.", true);
  }

  if (currentChatType === "user" && (blockedUsers.includes(currentChatUser) || blockedByUsers.includes(currentChatUser))) {
    return showAlert("Cannot send messages to or from a blocked user.", true);
  }

  const text = messageInput.value.trim();
  const files = fileInput.files;

  if (!currentChatUser) {
    return showAlert("Please select a user or group to chat with first!", true);
  }

  if (!text && files.length === 0) {
    return showAlert("Cannot send an empty message", true);
  }

  if (files.length > MAX_FILES_PER_MESSAGE) {
    return showAlert(`Maximum ${MAX_FILES_PER_MESSAGE} attachments allowed per message.`, true);
  }

  sendBtn.disabled = true;
  const originalText = sendBtn.textContent;
  sendBtn.textContent = "...";

  try {
    const typingRef = doc(db, "typing", `${currentUser}_${currentChatUser}`);
    await setDoc(typingRef, { isTyping: false, time: Date.now() }, { merge: true });

    let attachments = [];
    if (files.length > 0) {
      for (let i = 0; i < files.length; i++) {
        const uploadedAsset = await validateAndUploadFile(files[i]);
        attachments.push(uploadedAsset);
      }
    }

    let sanitizedReplyTo = null;
    if (activeReplyTo) {
      sanitizedReplyTo = {
        id: activeReplyTo.id,
        text: activeReplyTo.text,
        from: activeReplyTo.from
      };
    }

    await addDoc(collection(db, "messages"), {
      from: currentUser,
      to: currentChatUser,
      isGroup: currentChatType === "group",
      text: text,
      attachments: attachments,
      time: Date.now(),
      seenBy: [currentUser],
      reactions: {},
      replyTo: sanitizedReplyTo
    });

    messageInput.value = "";
    fileInput.value = "";
    activeReplyTo = null;
    replyPreviewBar.style.display = "none";
  } catch (err) {
    showAlert(err.message || "Failed to send message", true);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = originalText;
  }
};

const deleteChatBtn = document.getElementById("deleteChatBtn");
deleteChatBtn.onclick = async () => {
  if (!currentChatUser) return;
  showConfirm(`Clear chat with ${currentChatUser}?`, async () => {
    try {
      let q;
      if (currentChatType === "group") {
        q = query(collection(db, "messages"), where("to", "==", currentChatUser), where("isGroup", "==", true));
      } else {
        q = query(collection(db, "messages"));
      }
      const snap = await getDocs(q);
      const batch = writeBatch(db);
      snap.forEach(docSnap => {
        const m = docSnap.data();
        let matches = false;
        if (currentChatType === "group") {
          matches = m.isGroup === true && m.to === currentChatUser;
        } else {
          matches = !m.isGroup && ((m.from === currentUser && m.to === currentChatUser) || (m.from === currentChatUser && m.to === currentUser));
        }

        if (matches) {
          if (m.attachments && Array.isArray(m.attachments)) {
            queueCloudinaryDeletion(m.attachments);
          }
          batch.delete(doc(db, "messages", docSnap.id));
        }
      });
      await batch.commit();

      messages.innerHTML = "";
      lastVisibleMessageDoc = null;
      olderMessagesAvailable = false;
      showAlert("Chat cleared and all associated media/messages cleaned up.");
    } catch (e) {
      showAlert("Error clearing chat", true);
    }
  });
};

window.unsendMessage = async (docId) => {
  showConfirm("Unsend this message?", async () => {
    try {
      const msgRef = doc(db, "messages", docId);
      const msgSnap = await getDoc(msgRef);
      if (msgSnap.exists()) {
        const mData = msgSnap.data();
        if (mData.from !== currentUser && currentUser.toLowerCase() !== "admin") {
          return showAlert("Unauthorized: You can only unsend your own messages.", true);
        }
        if (mData.attachments && Array.isArray(mData.attachments)) {
          await queueCloudinaryDeletion(mData.attachments);
        }
      }
      await deleteDoc(msgRef);
      showAlert("Message unsent and media cleaned up.");
    } catch (e) {
      showAlert("Failed to unsend message", true);
    }
  });
};

function parseMarkdown(text) {
  if (!text) return "";
  let escaped = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
  
  escaped = escaped.replace(/\*(.*?)\*/g, '<strong>$1</strong>');
  escaped = escaped.replace(/_(.*?)_/g, '<em>$1</em>');
  escaped = escaped.replace(/~(.*?)~/g, '<del>$1</del>');
  escaped = escaped.replace(/`(.*?)`/g, '<code style="background:rgba(0,0,0,0.4); padding:2px 6px; border-radius:4px; font-family:monospace; color:#a3f1c0;">$1</code>');
  
  return escaped;
}

let lastNotifiedMsgId = "";

function loadMessages() {
  if (!currentChatUser) return;
  if (activeMessagesUnsubscribe) {
    activeMessagesUnsubscribe();
    activeMessagesUnsubscribe = null;
  }

  messages.innerHTML = "";
  lastVisibleMessageDoc = null;
  olderMessagesAvailable = true;

  let messagesQuery;
  if (currentChatType === "group") {
    messagesQuery = query(
      collection(db, "messages"),
      where("isGroup", "==", true),
      where("to", "==", currentChatUser),
      orderBy("time", "desc"),
      limit(35)
    );
  } else {
    messagesQuery = query(
      collection(db, "messages"),
      where("isGroup", "==", false),
      orderBy("time", "desc"),
      limit(100)
    );
  }

  activeMessagesUnsubscribe = onSnapshot(messagesQuery, async snap => {
    let unreadDocsToMark = [];
    const messageMap = {};
    const matchedDocs = [];

    snap.docs.forEach(docSnap => {
      const m = docSnap.data();
      messageMap[docSnap.id] = m;
      let isMatch = false;

      if (currentChatType === "group") {
        isMatch = m.isGroup === true && m.to === currentChatUser;
      } else {
        isMatch = m.isGroup === false && ((m.from === currentUser && m.to === currentChatUser) || (m.from === currentChatUser && m.to === currentUser));
      }

      if (isMatch) {
        matchedDocs.push({ id: docSnap.id, ...m });
      }
    });

    if (snap.docs.length > 0) {
      lastVisibleMessageDoc = snap.docs[snap.docs.length - 1];
    }
    if (snap.docs.length < 35) {
      olderMessagesAvailable = false;
    }

    matchedDocs.sort((a, b) => (a.time || 0) - (b.time || 0));

    messages.innerHTML = "";
    matchedDocs.forEach(m => {
      const docId = m.id;
      let seenBy = m.seenBy || [];
      if (m.from !== currentUser && !seenBy.includes(currentUser)) {
        unreadDocsToMark.push(docId);
        if (docId !== lastNotifiedMsgId && "Notification" in window && Notification.permission === "granted") {
          lastNotifiedMsgId = docId;
          try {
            new Notification(`New message from @${m.from}`, { body: m.text || "Sent an attachment" });
          } catch (e) {}
        }
      }

      const div = document.createElement("div");
      div.className = "bubble " + (m.from === currentUser ? "sent" : "received");
      
      let lastClick = 0;
      div.onclick = async (e) => {
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastClick;
        if (tapLength < 300 && tapLength > 0) {
          e.stopPropagation();
          const reactions = m.reactions || {};
          reactions[currentUser] = "❤️";
          await updateDoc(doc(db, "messages", docId), { reactions: reactions });
        } else {
          let replyTextSummary = m.text || "";
          if (!replyTextSummary && m.attachments && m.attachments.length > 0) {
            const firstType = m.attachments[0].type || "";
            if (firstType.startsWith("image/")) replyTextSummary = "[Image]";
            else if (firstType.startsWith("video/")) replyTextSummary = "[Video]";
            else if (firstType.startsWith("audio/")) replyTextSummary = "[Voice Note]";
            else replyTextSummary = "[Attachment]";
          }
          activeReplyTo = { id: docId, text: replyTextSummary || "Attachment", from: m.from };
          replyPreviewText.textContent = `Replying to @${m.from}: ${activeReplyTo.text}`;
          replyPreviewBar.style.display = "flex";
          messageInput.focus();
        }
        lastClick = currentTime;
      };

      let attachmentsHTML = "";
      if (m.attachments && Array.isArray(m.attachments)) {
        m.attachments.forEach(file => { attachmentsHTML += renderFile(file.url, file.type); });
      }

      let replyQuoteHTML = "";
      if (m.replyTo && messageMap[m.replyTo.id]) {
        replyQuoteHTML = `<div class="reply-quote"><strong>@${m.replyTo.from}</strong>: ${m.replyTo.text}</div>`;
      } else if (m.replyTo && !messageMap[m.replyTo.id]) {
        replyQuoteHTML = `<div class="reply-quote"><strong>@${m.replyTo.from}</strong>: Original message removed</div>`;
      }

      const senderLabel = (currentChatType === "group" && m.from !== currentUser) 
        ? `<div style="font-size:0.75rem; color:var(--primary); font-weight:bold; margin-bottom: 2px;">@${m.from}</div>` 
        : "";

      let reactionsHTML = "";
      if (m.reactions && Object.keys(m.reactions).length > 0) {
        let badges = "";
        Object.values(m.reactions).forEach(emoji => { badges += emoji; });
        reactionsHTML = `<div class="reactions-container"><span class="reaction-badge">${badges}</span></div>`;
      }

      let seenIndicator = "";
      let editUnsendActions = "";
      let copyActionBtn = "";

      if (m.text) {
        const escapedTextForCopy = m.text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        copyActionBtn = `<button class="msg-action-link" onclick="event.stopPropagation(); copyMessageText('${escapedTextForCopy}')">Copy</button>`;
      }

      if (m.from === currentUser) {
        const isSeen = currentChatType === "group" ? (seenBy.length > 1) : seenBy.includes(currentChatUser);
        seenIndicator = `<span class="seen-status">${isSeen ? '✓✓ Seen' : '✓ Sent'}</span>`;
        
        const escapedText = (m.text || "").replace(/'/g, "\\'");
        editUnsendActions = `
          <span class="msg-actions-inline">
            ${copyActionBtn}
            ${m.text ? `<button class="msg-action-link" onclick="event.stopPropagation(); editMessage('${docId}', '${escapedText}')">Edit</button>` : ""}
            <button class="msg-action-link danger" onclick="event.stopPropagation(); unsendMessage('${docId}')">Unsend</button>
          </span>
        `;
      } else if (m.text) {
        editUnsendActions = `<span class="msg-actions-inline">${copyActionBtn}</span>`;
      }

      const editedTag = m.edited ? `<span style="font-size:0.65rem; opacity:0.6; font-style:italic;">(edited)</span>` : "";
      const parsedText = parseMarkdown(m.text);

      div.innerHTML = `
        ${senderLabel}
        ${replyQuoteHTML}
        ${m.text ? `<div>${parsedText} ${editedTag}</div>` : ""}
        ${attachmentsHTML}
        ${reactionsHTML}
        <div class="meta">
          <span>${new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
          ${seenIndicator}
          ${editUnsendActions}
        </div>
      `;
      messages.appendChild(div);
    });

    if (chatMessageFilterInput.value.trim()) {
      filterMessagesInDOM(chatMessageFilterInput.value.trim().toLowerCase());
    }

    messages.scrollTop = messages.scrollHeight;

    if (unreadDocsToMark.length > 0) {
      for (let docId of unreadDocsToMark) {
        try {
          const msgRef = doc(db, "messages", docId);
          const msgSnap = await getDoc(msgRef);
          if (msgSnap.exists()) {
            let currentSeen = msgSnap.data().seenBy || [];
            if (!currentSeen.includes(currentUser)) {
              currentSeen.push(currentUser);
              await updateDoc(msgRef, { seenBy: currentSeen });
            }
          }
        } catch (e) {}
      }
    }
  });
}

messages.onscroll = async () => {
  if (messages.scrollTop === 0 && olderMessagesAvailable && !isFetchingOlderMessages && lastVisibleMessageDoc) {
    isFetchingOlderMessages = true;
    const oldScrollHeight = messages.scrollHeight;

    try {
      let olderQuery;
      if (currentChatType === "group") {
        olderQuery = query(
          collection(db, "messages"),
          where("isGroup", "==", true),
          where("to", "==", currentChatUser),
          orderBy("time", "desc"),
          startAfter(lastVisibleMessageDoc),
          limit(25)
        );
      } else {
        olderQuery = query(
          collection(db, "messages"),
          where("isGroup", "==", false),
          orderBy("time", "desc"),
          startAfter(lastVisibleMessageDoc),
          limit(25)
        );
      }

      const snapshot = await getDocs(olderQuery);
      if (snapshot.docs.length > 0) {
        lastVisibleMessageDoc = snapshot.docs[snapshot.docs.length - 1];
        const olderDocs = [];
        snapshot.docs.forEach(docSnap => {
          const m = docSnap.data();
          let isMatch = false;
          if (currentChatType === "group") {
            isMatch = m.isGroup === true && m.to === currentChatUser;
          } else {
            isMatch = m.isGroup === false && ((m.from === currentUser && m.to === currentChatUser) || (m.from === currentChatUser && m.to === currentUser));
          }
          if (isMatch) olderDocs.push({ id: docSnap.id, ...m });
        });

        olderDocs.sort((a, b) => (a.time || 0) - (b.time || 0));

        const fragment = document.createDocumentFragment();
        olderDocs.forEach(m => {
          const docId = m.id;
          const div = document.createElement("div");
          div.className = "bubble " + (m.from === currentUser ? "sent" : "received");
          
          let attachmentsHTML = "";
          if (m.attachments && Array.isArray(m.attachments)) {
            m.attachments.forEach(file => { attachmentsHTML += renderFile(file.url, file.type); });
          }

          let seenIndicator = "";
          if (m.from === currentUser) {
            const seenBy = m.seenBy || [];
            const isSeen = currentChatType === "group" ? (seenBy.length > 1) : seenBy.includes(currentChatUser);
            seenIndicator = `<span class="seen-status">${isSeen ? '✓✓ Seen' : '✓ Sent'}</span>`;
          }

          const parsedText = parseMarkdown(m.text);

          div.innerHTML = `
            ${m.text ? `<div>${parsedText}</div>` : ""}
            ${attachmentsHTML}
            <div class="meta">
              <span>${new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
              ${seenIndicator}
            </div>
          `;
          fragment.appendChild(div);
        });

        messages.insertBefore(fragment, messages.firstChild);
        messages.scrollTop = messages.scrollHeight - oldScrollHeight;
      } else {
        olderMessagesAvailable = false;
      }
    } catch (e) {
    } finally {
      isFetchingOlderMessages = false;
    }
  }
};

let localStream = null;
let peerConnections = {};
let remoteStreams = {};
let activeCallId = null;
let isVideoCall = false;
let callDocUnsubscribe = null;

const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };

const callModal = document.getElementById("callModal");

async function startCall(video) {
  if (!checkRateLimit("startCall", 5000)) {
    return showAlert("Please wait before starting another call.", true);
  }

  if (!currentChatUser) return;
  if (currentChatType === "user" && (blockedUsers.includes(currentChatUser) || blockedByUsers.includes(currentChatUser))) {
    return showAlert("Cannot initiate calls with a blocked user.", true);
  }

  isVideoCall = video;
  callModal.style.display = "flex";
  callTitle.textContent = `Calling ${currentChatUser}...`;
  callStatusText.textContent = "Initializing media...";
  acceptCallBtn.style.display = "none";
  toggleMicBtn.style.display = "inline-block";
  toggleCamBtn.style.display = isVideoCall ? "inline-block" : "none";
  isAudioMuted = false;
  isVideoOff = false;
  toggleMicBtn.textContent = "Mute Mic";
  toggleMicBtn.style.background = "var(--glass)";
  toggleCamBtn.textContent = "Cam Off";
  toggleCamBtn.style.background = "var(--glass)";

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
    localVideo.srcObject = localStream;
    if (isVideoCall) localVideo.classList.add("active"); else localVideo.classList.remove("active");

    const callRef = doc(collection(db, "calls"));
    activeCallId = callRef.id;

    await setDoc(callRef, {
      from: currentUser,
      to: currentChatUser,
      isGroup: currentChatType === "group",
      isVideo: isVideoCall,
      status: "ringing",
      participants: [currentUser],
      time: Date.now()
    });
    callStatusText.textContent = "Ringing...";

    if (currentChatType === "user") {
      const pc = createPeerConnection(currentChatUser);
      pc.onicecandidate = e => { if (e.candidate) addDoc(collection(db, "calls", activeCallId, `candidates_${currentUser}_${currentChatUser}`), e.candidate.toJSON()); };

      const offerDescription = await pc.createOffer();
      await pc.setLocalDescription(offerDescription);
      await updateDoc(callRef, { [`offers.${currentUser}`]: { type: offerDescription.type, sdp: offerDescription.sdp } });

      onSnapshot(callRef, snapshot => {
        const data = snapshot.data();
        if (data && data.answers && data.answers[currentChatUser] && !pc.currentRemoteDescription) {
          pc.setRemoteDescription(new RTCSessionDescription(data.answers[currentChatUser]));
          callStatusText.textContent = "Connected";
        }
        if (!snapshot.exists() || (data && data.status === "ended")) {
          showAlert("Call end");
          hangUpCall(false);
        }
        if (data && data.status === "rejected") {
          showAlert("Call rejected", true);
          hangUpCall(false);
        }
      });

      onSnapshot(collection(db, "calls", activeCallId, `candidates_${currentChatUser}_${currentUser}`), snapshot => {
        snapshot.docChanges().forEach(change => {
          if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        });
      });
    }
  } catch (err) {
    showAlert("Media access failed", true);
    hangUpCall(true);
  }
}

function listenForIncomingCalls() {
  if (incomingCallUnsubscribe) { incomingCallUnsubscribe(); incomingCallUnsubscribe = null; }
  incomingCallUnsubscribe = onSnapshot(query(collection(db, "calls"), where("status", "==", "ringing")), snapshot => {
    snapshot.docChanges().forEach(async change => {
      if (change.type === "added") {
        const callData = change.doc.data();
        const isGroupCall = callData.isGroup === true;
        const isForMe = isGroupCall ? (allGroups.some(g => g.id === callData.to && g.members.includes(currentUser))) : (callData.to === currentUser);
        
        if (isForMe && callData.from !== currentUser) {
          activeCallId = change.doc.id;
          isVideoCall = callData.isVideo;
          callModal.style.display = "flex";
          callTitle.textContent = `Incoming ${isVideoCall ? 'Video' : 'Voice'} Call from @${callData.from}`;
          callStatusText.textContent = "Ringing...";
          acceptCallBtn.style.display = "inline-block";
          toggleMicBtn.style.display = "none";
          toggleCamBtn.style.display = "none";
        }
      }
    });
  });
}

acceptCallBtn.onclick = async () => {
  if (!activeCallId) return;
  acceptCallBtn.style.display = "none";
  toggleMicBtn.style.display = "inline-block";
  toggleCamBtn.style.display = isVideoCall ? "inline-block" : "none";
  callStatusText.textContent = "Connecting...";

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
    localVideo.srcObject = localStream;
    if (isVideoCall) localVideo.classList.add("active"); else localVideo.classList.remove("active");

    const callRef = doc(db, "calls", activeCallId);
    const callSnap = await getDoc(callRef);
    if (!callSnap.exists()) return;
    const callData = callSnap.data();
    const callerName = callData.from;

    const pc = createPeerConnection(callerName);
    pc.onicecandidate = e => { if (e.candidate) addDoc(collection(db, "calls", activeCallId, `candidates_${currentUser}_${callerName}`), e.candidate.toJSON()); };

    if (callData.offers && callData.offers[callerName]) {
      await pc.setRemoteDescription(new RTCSessionDescription(callData.offers[callerName]));
      const answerDescription = await pc.createAnswer();
      await pc.setLocalDescription(answerDescription);
      await updateDoc(callRef, { [`answers.${currentUser}`]: { type: answerDescription.type, sdp: answerDescription.sdp }, status: "connected" });
      callStatusText.textContent = "Connected";
    }

    onSnapshot(collection(db, "calls", activeCallId, `candidates_${callerName}_${currentUser}`), snapshot => {
      snapshot.docChanges().forEach(change => {
        if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
      });
    });

    onSnapshot(callRef, snapshot => {
      const data = snapshot.data();
      if (!snapshot.exists() || (data && data.status === "ended")) {
        showAlert("Call ended");
        hangUpCall(false);
      }
    });
  } catch (err) {
    showAlert("Failed to answer call", true);
    hangUpCall(true);
  }
};

function createPeerConnection(targetUser) {
  const pc = new RTCPeerConnection(servers);
  peerConnections[targetUser] = pc;

  if (localStream) {
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  }

  pc.ontrack = event => {
    remoteStreams[targetUser] = event.streams[0];
    remoteVideo.srcObject = event.streams[0];
    remoteVideo.classList.add("active");
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed' || pc.connectionState === 'closed') {
      hangUpCall(false);
    }
  };

  return pc;
}

endCallBtn.onclick = () => hangUpCall(true);

async function hangUpCall(updateDb) {
  if (activeCallId && updateDb) {
    try {
      await updateDoc(doc(db, "calls", activeCallId), { status: "ended" });
    } catch (e) {}
  }

  if (localStream) {
    stopMediaTracks(localStream);
    localStream = null;
  }

  Object.values(peerConnections).forEach(pc => pc.close());
  peerConnections = {};
  remoteStreams = {};

  localVideo.srcObject = null;
  remoteVideo.srcObject = null;
  localVideo.classList.remove("active");
  remoteVideo.classList.remove("active");
  callModal.style.display = "none";
  activeCallId = null;
}
</script>
