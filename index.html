<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Z-Chat (Unified & Production Ready)</title>

<style>
:root {
  --primary: #25d366;
  --bg-dark: #0b141a;
  --panel: rgba(32, 44, 51, 0.94);
  --sent: #005c4b;
  --received: #202c33;
  --glass: rgba(255, 255, 255, 0.07);
  --danger: #ff4d4d;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg-dark);
  color: white;
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
}

#canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

.app { position: relative; height: 100vh; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; padding: 12px; }

.card { background: var(--panel); backdrop-filter: blur(14px); padding: 2rem; border-radius: 18px; border: 1px solid var(--glass); width: 100%; max-width: 400px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }

#chatScreen { display: none; width: 100%; max-width: 900px; height: 96vh; height: 96dvh; background: var(--panel); backdrop-filter: blur(18px); border-radius: 18px; flex-direction: column; overflow: hidden; border: 1px solid var(--glass); box-shadow: 0 14px 50px rgba(0,0,0,0.7); }

.header { padding: 12px 18px; background: rgba(0,0,0,0.4); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 1px solid var(--glass); }
.header-info { display: flex; flex-direction: column; cursor: pointer; }
.header-btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.header-btns button { background: none; border: 1px solid var(--glass); color: #ccc; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
.header-btns button:hover { color: white; background: var(--glass); }

.status-indicator { font-size: 0.75rem; color: #aaa; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #777; }
.status-dot.online { background: var(--primary); box-shadow: 0 0 6px var(--primary); }

/* Modals */
.confirm-modal, .call-modal, .requests-modal, .info-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  z-index: 2000;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.call-card {
  background: var(--panel);
  padding: 2rem;
  border-radius: 20px;
  text-align: center;
  border: 1px solid var(--glass);
  width: 100%;
  max-width: 450px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
}

.video-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  width: 100%;
  max-height: 320px;
  background: #000;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
}
.video-grid video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #111;
  display: none;
}
.video-grid video.active { display: block; }

/* Control Panels */
#adminGroupPanel, #adminMemberPanel {
  display: none;
  padding: 10px 18px;
  background: rgba(37, 211, 102, 0.08);
  border-bottom: 1px solid rgba(37, 211, 102, 0.15);
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
#adminMemberPanel { background: rgba(37, 211, 102, 0.04); }
#adminGroupPanel input, #adminMemberPanel input {
  flex: 1;
  min-width: 140px;
  padding: 8px 12px;
  font-size: 0.9rem;
}

/* Search Bar & Requests */
.search-bar-container { padding: 12px 18px; background: rgba(0,0,0,0.25); display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--glass); position: relative; }
.search-bar-container input { flex: 1; padding: 9px 14px; font-size: 0.9rem; }
.requests-badge-btn { position: relative; background: var(--glass); border: 1px solid var(--glass); color: white; padding: 9px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
.badge-count { position: absolute; top: -5px; right: -5px; background: var(--danger); color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 50%; display: none; }

#userList { display: flex; padding: 10px 18px; gap: 10px; overflow-x: auto; border-bottom: 1px solid var(--glass); background: rgba(0,0,0,0.15); flex-shrink: 0; }
.user-chip { position: relative; padding: 8px 16px; background: var(--glass); border-radius: 20px; cursor: pointer; white-space: nowrap; transition: 0.3s; border: 1px solid transparent; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
.user-chip.active { background: var(--primary); color: black; font-weight: bold; }
.chip-dot { width: 6px; height: 6px; border-radius: 50%; background: #777; }
.chip-dot.online { background: #00ff66; }

.unread-arrow-badge {
  background: var(--danger);
  color: white;
  font-size: 0.7rem;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-left: 4px;
}

/* Suggestions Dropdown */
#searchSuggestions { display: none; position: absolute; top: 65px; left: 18px; right: 18px; background: var(--panel); border: 1px solid var(--glass); border-radius: 10px; z-index: 100; max-height: 220px; overflow-y: auto; box-shadow: 0 8px 30px rgba(0,0,0,0.6); backdrop-filter: blur(18px); }
.suggestion-item { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass); font-size: 0.9rem; }
.suggestion-item:hover { background: rgba(255,255,255,0.08); }

#messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.bubble { max-width: 82%; padding: 10px 14px; border-radius: 12px; position: relative; font-size: 0.95rem; line-height: 1.4; word-break: break-word; user-select: none; cursor: pointer; }
.bubble.sent { align-self: flex-end; background: var(--sent); border-bottom-right-radius: 2px; }
.bubble.received { align-self: flex-start; background: var(--received); border-bottom-left-radius: 2px; }
.bubble img, .bubble video { border-radius: 8px; margin-top: 5px; display: block; border: 1px solid rgba(255,255,255,0.1); max-width: 100%; max-height: 260px; }
.bubble audio { margin-top: 5px; width: 100%; min-width: 220px; }
.meta { font-size: 0.7rem; opacity: 0.65; text-align: right; margin-top: 4px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
.seen-status { font-weight: bold; color: #4dc3ff; }

.msg-actions-inline { display: inline-flex; gap: 6px; margin-left: 6px; font-size: 0.7rem; }
.msg-action-link { color: #a3f1c0; cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; font-size: 0.7rem; }
.msg-action-link.danger { color: #ff8080; }

.reply-quote { background: rgba(0,0,0,0.3); border-left: 3px solid var(--primary); padding: 5px 10px; border-radius: 4px; font-size: 0.85rem; margin-bottom: 6px; opacity: 0.9; }
.reply-preview-bar { display: none; padding: 8px 16px; background: rgba(0,0,0,0.4); border-top: 1px solid var(--glass); align-items: center; justify-content: space-between; font-size: 0.85rem; }

.reactions-container { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.reaction-badge { background: rgba(0,0,0,0.45); border: 1px solid var(--glass); border-radius: 12px; padding: 2px 8px; font-size: 0.8rem; display: flex; align-items: center; gap: 3px; }

#emojiTray { display: none; position: absolute; bottom: 75px; left: 18px; background: var(--panel); border: 1px solid var(--glass); padding: 12px; border-radius: 14px; backdrop-filter: blur(18px); grid-template-columns: repeat(6, 1fr); gap: 8px; z-index: 10; box-shadow: 0 6px 25px rgba(0,0,0,0.7); }
.emoji-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; padding: 4px; border-radius: 6px; }
.emoji-btn:hover { background: var(--glass); }

.inputBar { padding: 12px 18px; background: rgba(0,0,0,0.4); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: relative; }
input { background: rgba(0,0,0,0.35); border: 1px solid var(--glass); color: white; padding: 10px 12px; border-radius: 8px; outline: none; font-size: 0.95rem; }
#messageInput { flex: 1; min-width: 140px; }

.media-actions { display: flex; gap: 6px; align-items: center; }
.action-btn { background: var(--glass); border: 1px solid var(--glass); color: white; padding: 10px 14px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
.action-btn:hover { background: rgba(255,255,255,0.15); }
.action-btn.recording { background: var(--danger); animation: pulse 1.2s infinite; }

@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

button { background: var(--primary); border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; transition: transform 0.1s; }
button:active { transform: scale(0.97); }

.input-group { display: flex; flex-direction: column; gap: 12px; }

.custom-alert { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; background: var(--primary); color: black; font-weight: bold; z-index: 3000; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; max-width: 90%; }
.custom-alert.error { background: var(--danger); color: white; }

.requests-card { background: var(--panel); padding: 1.5rem; border-radius: 16px; width: 100%; max-width: 360px; border: 1px solid var(--glass); max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
.request-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--glass); font-size: 0.9rem; }

.device-accounts-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
.device-account-chip { display: flex; justify-content: space-between; align-items: center; background: var(--glass); padding: 8px 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
.device-account-chip:hover { border-color: var(--primary); }

@media (max-width: 600px) {
  .app { padding: 0; justify-content: flex-start; }
  #chatScreen { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; border: none; margin: 0; }
  .card { width: 92%; padding: 1.5rem; }
  .inputBar { padding: 8px 12px; }
  .header-btns button { padding: 5px 8px; font-size: 0.75rem; }
}
</style>
</head>

<body>

<div id="canvas-container"></div>
<div id="customAlert" class="custom-alert"></div>

<div id="confirmModal" class="confirm-modal">
  <div class="card" style="text-align: center; max-width: 320px;">
    <h3 style="margin-top: 0; color: var(--danger);">Confirm Action</h3>
    <p id="confirmMessage" style="font-size: 0.95rem; line-height: 1.4; color: #eee; margin-bottom: 20px;"></p>
    <div style="display: flex; gap: 10px; justify-content: center;">
      <button id="confirmYesBtn" style="background: var(--danger); color: white; flex: 1;">Yes</button>
      <button id="confirmNoBtn" style="background: var(--glass); color: white; flex: 1;">Cancel</button>

  </div>
</div>

<div id="requestsModal" class="requests-modal">
  <div class="requests-card">
    <h3 style="margin-top:0; color:var(--primary)">Friend Requests</h3>
    <div id="requestsList" style="display:flex; flex-direction:column; gap:10px; margin: 15px 0;"></div>

</div>

<div id="groupInfoModal" class="info-modal">
  <div class="requests-card">
    <h3 id="groupInfoTitle" style="margin-top:0; color:var(--primary)">Group Members</h3>

</div>

<div id="callModal" class="call-modal">

    <div class="video-grid" id="videoGridContainer">
      <video id="remoteVideo" autoplay playsinline></video>

</div>

<div class="app">
  <div id="loginScreen">
    <div class="card">
      <h2 style="margin-top:0; color:var(--primary); text-align:center;">Z-Chat</h2>
      
      <div id="deviceAccountSection" style="display:none; margin-bottom: 15px;">
        <div style="font-size:0.8rem; color:#aaa; margin-bottom:6px;">Accounts on this device (<span id="deviceCountLabel">0</span>/3):</div>
        <div id="deviceAccountsList" class="device-accounts-list"></div>
        <button id="addNewAccountBtn" style="width:100%; background:var(--glass); color:white; font-size:0.85rem; margin-bottom:10px; display:none;">+ Add Another Account</button>
      </div>

      <div id="authFormContainer">
        <div style="display: flex; gap: 6px; margin-bottom: 18px;">
          <button id="tabLoginBtn" style="flex:1; background:var(--primary); color:black;" onclick="switchAuthTab('login')">Log In</button>
          <button id="tabSignupBtn" style="flex:1; background:var(--glass); color:white;" onclick="switchAuthTab('signup')">Sign Up</button>

          <input id="username" placeholder="Username">

  <div id="chatScreen" style="position:relative;">
    <div class="header">
      <div class="header-info" id="chatHeaderClickable" title="Click for info / rename">
        <div id="ownerDisplayLabel" style="font-size: 0.75rem; color: var(--primary); font-weight: bold;">Owner: <span id="ownerNameSpan"></span></div>
        <div id="chatTitle" style="font-weight:bold; font-size:1.1rem;">Z-Chat Direct</div>

      <div class="header-btns">

    <div id="adminGroupPanel" style="display: flex;">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, getDocs, doc, setDoc, getDoc, updateDoc, deleteDoc, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSy...", 
  authDomain: "nexon-p2p.firebaseapp.com",
  projectId: "nexon-p2p",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const CLOUD_NAME = "dju4t3pwa";
const UPLOAD_PRESET = "SOCIAL";

let DEVICE_ID = "";
async function getSecureDeviceFingerprint() {
  const nav = window.navigator;
  const sc = window.screen;
  const rawProps = [
    nav.userAgent,
    nav.language,
    nav.hardwareConcurrency || 'unknown',
    nav.deviceMemory || 'unknown',
    sc.width,
    sc.height,
    sc.colorDepth,
    new Date().getTimezoneOffset()
  ].join('|||');

  const msgBuffer = new TextEncoder().encode(rawProps);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

getSecureDeviceFingerprint().then(id => {
  DEVICE_ID = id;
  initDeviceAccountsUI();
});

function getDeviceAccounts() {
  try {
    const data = localStorage.getItem(`zchat_device_accounts_${DEVICE_ID}`);
    return data ? JSON.parse(data) : [];
  } catch (e) {
    return [];
  }
}

function saveDeviceAccount(username) {
  let accounts = getDeviceAccounts();
  if (!accounts.includes(username)) {
    if (accounts.length >= 3) return false;
    accounts.push(username);
    localStorage.setItem(`zchat_device_accounts_${DEVICE_ID}`, JSON.stringify(accounts));
  }
  return true;
}

function removeDeviceAccount(username) {
  let accounts = getDeviceAccounts();
  accounts = accounts.filter(acc => acc !== username);
  localStorage.setItem(`zchat_device_accounts_${DEVICE_ID}`, JSON.stringify(accounts));
}

function initDeviceAccountsUI() {
  const accounts = getDeviceAccounts();
  const section = document.getElementById("deviceAccountSection");
  const listContainer = document.getElementById("deviceAccountsList");
  const countLabel = document.getElementById("deviceCountLabel");
  const addBtn = document.getElementById("addNewAccountBtn");
  const authForm = document.getElementById("authFormContainer");

  countLabel.textContent = accounts.length;
  listContainer.innerHTML = "";

  if (accounts.length > 0) {
    section.style.display = "block";
    accounts.forEach(acc => {
      const chip = document.createElement("div");
      chip.className = "device-account-chip";
      chip.innerHTML = `
        <span style="font-weight:bold; color:var(--primary);">@${acc}</span>
        <button style="padding:4px 10px; font-size:0.75rem;" onclick="switchDeviceAccount('${acc}')">Log In</button>
      `;
      listContainer.appendChild(chip);
    });

    if (accounts.length < 3) {
      addBtn.style.display = "block";
    } else {
      addBtn.style.display = "none";
    }

    if (accounts.length >= 3 && authForm.style.display !== "block") {
      authForm.style.display = "none";
    }
  } else {
    section.style.display = "none";
    authForm.style.display = "block";
  }
}

window.switchDeviceAccount = (usernameVal) => {
  document.getElementById("username").value = usernameVal;
  document.getElementById("password").value = "";
  document.getElementById("password").focus();
  switchAuthTab('login');
};

document.getElementById("addNewAccountBtn").onclick = () => {
  document.getElementById("authFormContainer").style.display = "block";
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("username").focus();
};

async function uploadToCloudinary(file) {
  const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`;
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);

  const res = await fetch(url, { method: "POST", body: formData });
  if (!res.ok) throw new Error("Upload failed");
  const data = await res.json();
  return data.secure_url;
}

function renderFile(url, type) {
  if (!url) return "";
  if (type && type.startsWith("image/")) return `<img src="${url}" loading="lazy" style="max-width:100%; border-radius:8px; margin-bottom: 5px;">`;
  if (type && type.startsWith("video/")) return `<video src="${url}" controls style="max-width:100%; border-radius:8px; margin-bottom: 5px;"></video>`;
  if (type && type.startsWith("audio/")) {
    return `
      <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 5px;">
        <div style="display: flex; align-items: center; gap: 6px; opacity: 0.8; font-size: 0.8rem;">
          <span>🎙️ Voice Note</span>
        </div>
        <audio src="${url}" controls style="width:100%; height:32px;"></audio>
      </div>`;
  }
  return `<a href="${url}" target="_blank" style="color:var(--primary); display: block; margin-bottom: 5px;">📎 View Attachment</a>`;
}

document.getElementById("authActionBtn").onclick = async () => {
  const u = username.value.trim();
  const p = password.value.trim();
  if (!u || !p) return showAlert("Fill all fields", true);

  const userRef = doc(db, "users", u);
  const userSnap = await getDoc(userRef);

  if (authMode === 'signup') {
    if (userSnap.exists()) {
      return showAlert(`Username "${u}" is already taken! Please choose another.`, true);
    }
    const accounts = getDeviceAccounts();
    if (!accounts.includes(u) && accounts.length >= 3) {
      return showAlert("Maximum limit of 3 accounts per device reached!", true);
    }

    await setDoc(userRef, {
      password: p,
      lastSeen: Date.now(),
      online: true,
      friends: ["admin"],
      requests: []
    });
    saveDeviceAccount(u);
    currentUser = u;
    initChatSession();
    showAlert("Account created successfully!");
  } else {
    if (!userSnap.exists()) {
      return showAlert("Account does not exist. Please Sign Up.", true);
    }
    const data = userSnap.data();
    if (data.password && data.password !== p) {
      return showAlert("Incorrect password!", true);
    }

    const savedOk = saveDeviceAccount(u);
    if (!savedOk) {
      return showAlert("Maximum limit of 3 accounts per device reached on this device!", true);
    }

    currentUser = u;
    initChatSession();
    showAlert("Logged in successfully!");
  }
};

function cleanupSessionListeners() {
  if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
  if (activeMessagesUnsubscribe) { activeMessagesUnsubscribe(); activeMessagesUnsubscribe = null; }
  if (activeTypingUnsubscribe) { activeTypingUnsubscribe(); activeTypingUnsubscribe = null; }
  if (globalDirectoryUnsubscribe) { globalDirectoryUnsubscribe(); globalDirectoryUnsubscribe = null; }
  if (globalGroupsUnsubscribe) { globalGroupsUnsubscribe(); globalGroupsUnsubscribe = null; }
  if (globalMessagesUnsubscribe) { globalMessagesUnsubscribe(); globalMessagesUnsubscribe = null; }
  if (incomingCallUnsubscribe) { incomingCallUnsubscribe(); incomingCallUnsubscribe = null; }
}

function initChatSession() {
  updatePresence(true);
  if (heartbeatInterval) clearInterval(heartbeatInterval);
  heartbeatInterval = setInterval(() => updatePresence(true), 15000);
  window.addEventListener("beforeunload", () => updatePresence(false));

  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
  }

  loginScreen.style.display = "none";
  chatScreen.style.display = "flex";
  
  updateAdminPanels();
  loadDirectoryAndUserData();
  listenGlobalMessages();
  listenForIncomingCalls();
}

const renameProfileBtn = document.getElementById("renameProfileBtn");
renameProfileBtn.onclick = async () => {
  const newName = prompt("Enter new username:", currentUser);
  if (!newName || newName.trim() === "" || newName === currentUser) return;
  const trimmed = newName.trim();

  try {
    const newRef = doc(db, "users", trimmed);
    const newSnap = await getDoc(newRef);
    if (newSnap.exists()) {
      return showAlert("Username already taken! Please choose another.", true);
    }

    const oldRef = doc(db, "users", currentUser);
    const oldSnap = await getDoc(oldRef);
    const userData = oldSnap.data() || {};

    await setDoc(newRef, userData);

    // Update local device accounts list record
    let accounts = getDeviceAccounts();
    if (accounts.includes(currentUser)) {
      accounts = accounts.map(acc => acc === currentUser ? trimmed : acc);
      localStorage.setItem(`zchat_device_accounts_${DEVICE_ID}`, JSON.stringify(accounts));
    }

    const usersSnap = await getDocs(collection(db, "users"));
    const groupsSnap = await getDocs(collection(db, "groups"));
    const messagesSnap = await getDocs(collection(db, "messages"));

    const updatePromises = [];

    usersSnap.forEach(userDoc => {
      if (userDoc.id === currentUser || userDoc.id === trimmed) return;
      const uData = userDoc.data();
      let modified = false;
      let friends = uData.friends || [];
      let requests = uData.requests || [];

      if (friends.includes(currentUser)) {
        friends = friends.map(f => f === currentUser ? trimmed : f);
        modified = true;
      }
      if (requests.includes(currentUser)) {
        requests = requests.map(r => r === currentUser ? trimmed : r);
        modified = true;
      }

      if (modified) {
        updatePromises.push(updateDoc(doc(db, "users", userDoc.id), {
          friends: friends,
          requests: requests
        }));
      }
    });

    groupsSnap.forEach(groupDoc => {
      const gData = groupDoc.data();
      let gModified = false;
      let members = gData.members || [];
      let createdBy = gData.createdBy;

      if (members.includes(currentUser)) {
        members = members.map(m => m === currentUser ? trimmed : m);
        gModified = true;
      }
      if (createdBy === currentUser) {
        createdBy = trimmed;
        gModified = true;
      }

      if (gModified) {
        updatePromises.push(updateDoc(doc(db, "groups", groupDoc.id), {
          members: members,
          createdBy: createdBy
        }));
      }
    });

    messagesSnap.forEach(msgDoc => {
      const mData = msgDoc.data();
      let mModified = false;
      let updatePayload = {};

      if (mData.from === currentUser) {
        updatePayload.from = trimmed;
        mModified = true;
      }
      if (!mData.isGroup && mData.to === currentUser) {
        updatePayload.to = trimmed;
        mModified = true;
      }
      if (mData.replyTo && mData.replyTo.from === currentUser) {
        updatePayload.replyTo = { ...mData.replyTo, from: trimmed };
        mModified = true;
      }

      let seenBy = mData.seenBy || [];
      if (seenBy.includes(currentUser)) {
        updatePayload.seenBy = seenBy.map(s => s === currentUser ? trimmed : s);
        mModified = true;
      }

      if (mModified) {
        updatePromises.push(updateDoc(doc(db, "messages", msgDoc.id), updatePayload));
      }
    });

    await Promise.all(updatePromises);
    await deleteDoc(oldRef);

    currentUser = trimmed;
    currentChatUser = ""; 
    currentChatType = "user";
    messages.innerHTML = "";
    updateAdminPanels();
    renderList();
    updateHeaderStatus();
    initDeviceAccountsUI();
    showAlert("Profile renamed successfully!");
  } catch (e) {
    showAlert("Failed to rename profile", true);
  }
};

  showConfirm("Burn Profile? This will permanently delete your account, remove you from groups, and clear your records.", async () => {
    try {
      const targetUser = currentUser;

      await deleteDoc(doc(db, "users", targetUser));
      removeDeviceAccount(targetUser);

      const usersSnap = await getDocs(collection(db, "users"));
      const groupsSnap = await getDocs(collection(db, "groups"));
      const cleanupPromises = [];

      usersSnap.forEach(userDoc => {
        if (userDoc.id === targetUser) return;
        const uData = userDoc.data();
        let modified = false;
        let friends = uData.friends || [];
        let requests = uData.requests || [];

        if (friends.includes(targetUser)) {
          friends = friends.filter(f => f !== targetUser);
          modified = true;
        }
        if (requests.includes(targetUser)) {
          requests = requests.filter(r => r !== targetUser);
          modified = true;
        }

        if (modified) {
          cleanupPromises.push(updateDoc(doc(db, "users", userDoc.id), {
            friends: friends,
            requests: requests
          }));
        }
      });

      groupsSnap.forEach(groupDoc => {
        const gData = groupDoc.data();
        let members = gData.members || [];
        let createdBy = gData.createdBy;
        let groupModified = false;

        if (members.includes(targetUser)) {
          members = members.filter(m => m !== targetUser);
          groupModified = true;
        }

        if (groupModified) {
          if (members.length === 0) {
            cleanupPromises.push(deleteDoc(doc(db, "groups", groupDoc.id)));
          } else {
            if (createdBy === targetUser) {
              createdBy = members[0];
            }
            cleanupPromises.push(updateDoc(doc(db, "groups", groupDoc.id), {
              members: members,
              createdBy: createdBy
            }));
          }
        }
      });

      const q = query(collection(db, "messages"), where("from", "==", targetUser));
      const snap = await getDocs(q);
      snap.forEach(docSnap => {
        cleanupPromises.push(deleteDoc(doc(db, "messages", docSnap.id)));
      });

      await Promise.all(cleanupPromises);
      cleanupSessionListeners();
      currentUser = "";
      chatScreen.style.display = "none";
      loginScreen.style.display = "flex";
      initDeviceAccountsUI();
      showAlert("Account burned successfully.");
    } catch (e) {
      showAlert("Error burning profile", true);

window.acceptRequest = async (fromUser) => {
  try {
    const myRef = doc(db, "users", currentUser);
    const mySnap = await getDoc(myRef);
    let myFriends = mySnap.data().friends || [];
    let myReqs = mySnap.data().requests || [];
    
    if (!myFriends.includes(fromUser)) myFriends.push(fromUser);
    myReqs = myReqs.filter(u => u !== fromUser);
    await updateDoc(myRef, { friends: myFriends, requests: myReqs });

    const otherRef = doc(db, "users", fromUser);
    const otherSnap = await getDoc(otherRef);
    if (otherSnap.exists()) {
      let otherFriends = otherSnap.data().friends || [];
      if (!otherFriends.includes(currentUser)) {
        otherFriends.push(currentUser);
        await updateDoc(otherRef, { friends: otherFriends });
      }
    }

    showAlert(`You are now friends with @${fromUser}!`);
    renderRequestsModal();
  } catch (e) {
    showAlert("Error accepting request", true);
  }
};

function loadDirectoryAndUserData() {
  globalDirectoryUnsubscribe = onSnapshot(collection(db, "users"), userSnap => {
    allUsersDirectory = [];
    userStatuses = {};
    const now = Date.now();
    userSnap.forEach(d => {
      const data = d.data();
      const isOnline = data.online && (now - (data.lastSeen || 0) < 35000);
      userStatuses[d.id] = { online: isOnline, lastSeen: data.lastSeen || 0 };
      allUsersDirectory.push(d.id);

      if (d.id === currentUser) {
        friendsList = data.friends || ["admin"];
        friendRequests = data.requests || [];
        if (friendRequests.length > 0) {
          requestBadgeCount.style.display = "inline-block";
          requestBadgeCount.textContent = friendRequests.length;
        } else {
          requestBadgeCount.style.display = "none";
        }
      }
    });
    renderList();
    updateHeaderStatus();
  });

  globalGroupsUnsubscribe = onSnapshot(collection(db, "groups"), groupSnap => {
    allGroups = [];
    groupSnap.forEach(d => {
      const groupData = d.data();
      const members = groupData.members || [];
      if (members.includes(currentUser) || groupData.createdBy === currentUser) {
        allGroups.push({ id: d.id, type: "group", members: members, createdBy: groupData.createdBy });
      }
    });
    renderList();
  });
}

function listenGlobalMessages() {
  globalMessagesUnsubscribe = onSnapshot(collection(db, "messages"), snap => {
    allMessagesCache = [];
    snap.forEach(docSnap => {
      allMessagesCache.push({ id: docSnap.id, ...docSnap.data() });
    });
    renderList();
  });
}

function updateHeaderStatus() {
  if (!currentChatUser) {
    headerStatusText.textContent = "Select a chat";
    headerStatusDot.className = "status-dot";
    return;
  }
  if (currentChatType === "group") {
    headerStatusDot.className = "status-dot online";
    headerStatusText.textContent = "Group Chat (Click for info)";
  } else {
    const status = userStatuses[currentChatUser];
    if (status && status.online) {
      headerStatusDot.className = "status-dot online";
      headerStatusText.textContent = "Online";
    } else {
      headerStatusDot.className = "status-dot";
      if (status && status.lastSeen) {
        const diffMs = Date.now() - status.lastSeen;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMins / 60);
        const diffDays = Math.floor(diffHours / 24);

        let timeAgo = "";
        if (diffDays > 0) timeAgo = `${diffDays}d ago`;
        else if (diffHours > 0) timeAgo = `${diffHours}h ago`;
        else if (diffMins > 0) timeAgo = `${diffMins}m ago`;
        else timeAgo = "Just now";
        
        headerStatusText.textContent = `Last seen ${timeAgo}`;
      } else {
        headerStatusText.textContent = "Offline";
      }
    }
  }
}

function renderList() {
  userList.innerHTML = "";
  
  allGroups.forEach(g => {
    let unreadCount = 0;
    allMessagesCache.forEach(m => {
      if (m.isGroup && m.to === g.id && m.from !== currentUser) {
        const seenBy = m.seenBy || [];
        if (!seenBy.includes(currentUser)) unreadCount++;
      }
    });

    const chip = document.createElement("div");
    chip.className = "user-chip" + (currentChatUser === g.id && currentChatType === "group" ? " active" : "");
    let badgeHtml = unreadCount > 0 ? `<span class="unread-arrow-badge">↙ ${unreadCount}</span>` : "";
    chip.innerHTML = `👥 #${g.id} ${badgeHtml}`;
    chip.onclick = () => {
      currentChatUser = g.id;
      currentChatType = "group";
      chatTitle.textContent = `#${g.id}`;
      updateAdminPanels();
      renderList(); 
      updateHeaderStatus();
      loadMessages();
      listenTypingStatus();
    };
    userList.appendChild(chip);
  });

  friendsList.forEach(friendId => {
    if (friendId === currentUser) return;
    const status = userStatuses[friendId] || { online: false };
    
    let unreadCount = 0;
    allMessagesCache.forEach(m => {
      if (!m.isGroup && m.from === friendId && m.to === currentUser) {
        const seenBy = m.seenBy || [];
        if (!seenBy.includes(currentUser)) unreadCount++;
      }
    });

    const chip = document.createElement("div");
    chip.className = "user-chip" + (currentChatUser === friendId && currentChatType === "user" ? " active" : "");
    let badgeHtml = unreadCount > 0 ? `<span class="unread-arrow-badge">↙ ${unreadCount}</span>` : "";
    chip.innerHTML = `<span class="chip-dot ${status.online ? 'online' : ''}"></span> @${friendId} ${badgeHtml}`;
    chip.onclick = () => {
      currentChatUser = friendId;
      currentChatType = "user";
      chatTitle.textContent = `@${friendId}`;
      updateAdminPanels();
      renderList(); 
      updateHeaderStatus();
      loadMessages();
      listenTypingStatus();
    };
    userList.appendChild(chip);
  });
}

function listenTypingStatus() {
  if (!currentChatUser) return;
  if (activeTypingUnsubscribe) {
    activeTypingUnsubscribe();
    activeTypingUnsubscribe = null;
  }

  if (currentChatType === "group") {
    const typingQuery = query(collection(db, "typing"));
    activeTypingUnsubscribe = onSnapshot(typingQuery, snap => {
      let typingNames = [];
      const now = Date.now();
      snap.forEach(d => {
        const parts = d.id.split("_");
        if (parts.length === 2) {
          const fromUser = parts[0];
          const toTarget = parts[1];
          if (toTarget === currentChatUser && fromUser !== currentUser && d.data().isTyping && (now - d.data().time < 3000)) {
            typingNames.push(fromUser);
          }
        }
      });
      if (typingNames.length > 0) {
        headerStatusText.textContent = `${typingNames.join(", ")} typing...`;
      } else {
        updateHeaderStatus();
      }
    });
  } else {
    const typingRef = doc(db, "typing", `${currentChatUser}_${currentUser}`);
    activeTypingUnsubscribe = onSnapshot(typingRef, snap => {
      if (snap.exists() && snap.data().isTyping && (Date.now() - snap.data().time < 3000)) {
        headerStatusText.textContent = "typing...";
      } else {
        updateHeaderStatus();
      }
    });
  }
}

let mediaRecorder = null;
let audioChunks = [];
let recordedAudioBlob = null;
const recordVoiceBtn = document.getElementById("recordVoiceBtn");
let isRecording = false;

function stopMediaTracks(stream) {
  if (!stream) return;
  try {
    stream.getTracks().forEach(track => track.stop());
  } catch (err) {}
}

recordVoiceBtn.onclick = async () => {
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        stopMediaTracks(stream);
        if (recordedAudioBlob && currentChatUser) await sendAudioMessage(recordedAudioBlob);
      };

      mediaRecorder.start();
      isRecording = true;
      recordVoiceBtn.classList.add("recording");
      showAlert("Recording voice note...");
    } catch (err) {
      showAlert("Microphone unavailable", true);
    }
  } else {
    if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    isRecording = false;
    recordVoiceBtn.classList.remove("recording");
  }
};

async function sendAudioMessage(blob) {
  if (!currentChatUser) return;
  try {
    const audioFile = new File([blob], "voice_note.webm", { type: "audio/webm" });
    const fileUrl = await uploadToCloudinary(audioFile);

    await addDoc(collection(db, "messages"), {
      from: currentUser,
      to: currentChatUser,
      isGroup: currentChatType === "group",
      text: "",
      attachments: [{ url: fileUrl, type: "audio/webm" }],
      time: Date.now(),
      seenBy: [currentUser],
      reactions: {},
      replyTo: null
    });
  } catch (err) {
    showAlert("Failed to send voice note", true);
  }
}

const sendBtn = document.getElementById("sendBtn");
sendBtn.onclick = async () => {
  const text = messageInput.value.trim();

  try {

        attachments.push({ url: fileUrl, type: files[i].type });

    await addDoc(collection(db, "messages"), {

let lastNotifiedMsgId = "";
function loadMessages() {
  if (!currentChatUser) return;
  if (activeMessagesUnsubscribe) {
    activeMessagesUnsubscribe();
    activeMessagesUnsubscribe = null;
  }

  let q = query(collection(db, "messages"));
  
  activeMessagesUnsubscribe = onSnapshot(q, async snap => {
    messages.innerHTML = "";
    let unreadDocsToMark = [];
    const messageMap = {};
    const matchedDocs = [];

    snap.forEach(docSnap => {
      const m = docSnap.data();
      messageMap[docSnap.id] = m;
      const isGroupMessage = m.isGroup === true;
      let isMatch = false;

      if (currentChatType === "group") {
        isMatch = isGroupMessage && (m.to === currentChatUser);
      } else {
        isMatch = !isGroupMessage && ((m.from === currentUser && m.to === currentChatUser) || (m.from === currentChatUser && m.to === currentUser));
      }

      if (isMatch) {
        matchedDocs.push({ id: docSnap.id, ...m });
      }
    });

    matchedDocs.sort((a, b) => (a.time || 0) - (b.time || 0));

    matchedDocs.forEach(m => {
      const docId = m.id;
      let seenBy = m.seenBy || [];
      if (m.from !== currentUser && !seenBy.includes(currentUser)) {
        unreadDocsToMark.push(docId);
        if (docId !== lastNotifiedMsgId && "Notification" in window && Notification.permission === "granted") {
          lastNotifiedMsgId = docId;
          try {
            new Notification(`New message from @${m.from}`, { body: m.text || "Sent an attachment" });
          } catch (e) {}
        }
      }

      const div = document.createElement("div");
      div.className = "bubble " + (m.from === currentUser ? "sent" : "received");
      
      let lastClick = 0;
      div.onclick = async (e) => {
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastClick;
        if (tapLength < 300 && tapLength > 0) {
          e.stopPropagation();
          const reactions = m.reactions || {};
          reactions[currentUser] = "❤️";
          await updateDoc(doc(db, "messages", docId), { reactions: reactions });
        } else {
          activeReplyTo = { id: docId, text: m.text || "Attachment", from: m.from };
          replyPreviewText.textContent = `Replying to @${m.from}: ${activeReplyTo.text}`;
          replyPreviewBar.style.display = "flex";
          messageInput.focus();
        }
        lastClick = currentTime;
      };

      let attachmentsHTML = "";
      if (m.attachments && Array.isArray(m.attachments)) {
        m.attachments.forEach(file => { attachmentsHTML += renderFile(file.url, file.type); });
      }

      let replyQuoteHTML = "";
      if (m.replyTo && messageMap[m.replyTo.id]) {
        replyQuoteHTML = `<div class="reply-quote"><strong>@${m.replyTo.from}</strong>: ${m.replyTo.text}</div>`;
      }

      const senderLabel = (currentChatType === "group" && m.from !== currentUser) 
        ? `<div style="font-size:0.75rem; color:var(--primary); font-weight:bold; margin-bottom: 2px;">@${m.from}</div>` 
        : "";

      let reactionsHTML = "";
      if (m.reactions && Object.keys(m.reactions).length > 0) {
        let badges = "";
        Object.values(m.reactions).forEach(emoji => { badges += emoji; });
        reactionsHTML = `<div class="reactions-container"><span class="reaction-badge">${badges}</span></div>`;
      }

      let seenIndicator = "";
      let editUnsendActions = "";
      if (m.from === currentUser) {
        const isSeen = currentChatType === "group" ? (seenBy.length > 1) : seenBy.includes(currentChatUser);
        seenIndicator = `<span class="seen-status">${isSeen ? '✓✓ Seen' : '✓ Sent'}</span>`;
        
        const escapedText = (m.text || "").replace(/'/g, "\\'");
        editUnsendActions = `
          <span class="msg-actions-inline">
            ${m.text ? `<button class="msg-action-link" onclick="event.stopPropagation(); editMessage('${docId}', '${escapedText}')">Edit</button>` : ""}
            <button class="msg-action-link danger" onclick="event.stopPropagation(); unsendMessage('${docId}')">Unsend</button>
          </span>
        `;
      }

      const editedTag = m.edited ? `<span style="font-size:0.65rem; opacity:0.6; font-style:italic;">(edited)</span>` : "";

      div.innerHTML = `
        ${senderLabel}
        ${replyQuoteHTML}
        ${m.text ? `<div>${m.text} ${editedTag}</div>` : ""}
        ${attachmentsHTML}
        ${reactionsHTML}
        <div class="meta">
          <span>${new Date(m.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
          ${seenIndicator}
          ${editUnsendActions}
        </div>
      `;
      messages.appendChild(div);
    });

    messages.scrollTop = messages.scrollHeight;

    if (unreadDocsToMark.length > 0) {
      for (let docId of unreadDocsToMark) {
        try {
          const msgRef = doc(db, "messages", docId);
          const msgSnap = await getDoc(msgRef);
          if (msgSnap.exists()) {
            let currentSeen = msgSnap.data().seenBy || [];
            if (!currentSeen.includes(currentUser)) {
              currentSeen.push(currentUser);
              await updateDoc(msgRef, { seenBy: currentSeen });
            }
          }
        } catch (e) {}
      }
    }
  });
}

let localStream = null;
let peerConnections = {};
let remoteStreams = {};
let activeCallId = null;
let isVideoCall = false;
let callDocUnsubscribe = null;

const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };

const callModal = document.getElementById("callModal");
const callTitle = document.getElementById("callTitle");
const callStatusText = document.getElementById("callStatusText");
const localVideo = document.getElementById("localVideo");
const remoteVideo = document.getElementById("remoteVideo");
const videoGridContainer = document.getElementById("videoGridContainer");
const acceptCallBtn = document.getElementById("acceptCallBtn");
const endCallBtn = document.getElementById("endCallBtn");

voiceCallBtn.onclick = () => startCall(false);
videoCallBtn.onclick = () => startCall(true);

async function startCall(video) {
  if (!currentChatUser) return;
  isVideoCall = video;
  callModal.style.display = "flex";
  callTitle.textContent = `Calling ${currentChatUser}...`;
  callStatusText.textContent = "Initializing media...";
  acceptCallBtn.style.display = "none";

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
    localVideo.srcObject = localStream;
    if (isVideoCall) localVideo.classList.add("active"); else localVideo.classList.remove("active");

    const callRef = doc(collection(db, "calls"));
    activeCallId = callRef.id;

    await setDoc(callRef, {
      from: currentUser,
      to: currentChatUser,
      isGroup: currentChatType === "group",
      isVideo: isVideoCall,
      status: "ringing",
      participants: [currentUser],
      time: Date.now()
    });
    callStatusText.textContent = "Ringing...";

    if (currentChatType === "user") {
      const pc = createPeerConnection(currentChatUser);
      pc.onicecandidate = e => { if (e.candidate) addDoc(collection(db, "calls", activeCallId, `candidates_${currentUser}_${currentChatUser}`), e.candidate.toJSON()); };

      const offerDescription = await pc.createOffer();
      await pc.setLocalDescription(offerDescription);
      await updateDoc(callRef, { [`offers.${currentUser}`]: { type: offerDescription.type, sdp: offerDescription.sdp } });

      onSnapshot(callRef, snapshot => {
        const data = snapshot.data();
        if (data && data.answers && data.answers[currentChatUser] && !pc.currentRemoteDescription) {
          pc.setRemoteDescription(new RTCSessionDescription(data.answers[currentChatUser]));
          callStatusText.textContent = "Connected";
        }
        if (data && data.status === "ended") hangUpCall(false);
      });

      onSnapshot(collection(db, "calls", activeCallId, `candidates_${currentChatUser}_${currentUser}`), snapshot => {
        snapshot.docChanges().forEach(change => {
          if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
        });
      });
    }
  } catch (err) {
    showAlert("Media access failed", true);
    hangUpCall(true);
  }
}

function listenForIncomingCalls() {
  if (incomingCallUnsubscribe) { incomingCallUnsubscribe(); incomingCallUnsubscribe = null; }
  incomingCallUnsubscribe = onSnapshot(query(collection(db, "calls"), where("status", "==", "ringing")), snapshot => {
    snapshot.docChanges().forEach(async change => {
      if (change.type === "added") {
        const callData = change.doc.data();
        const isGroupCall = callData.isGroup === true;
        const isForMe = isGroupCall ? (allGroups.some(g => g.id === callData.to && g.members.includes(currentUser))) : (callData.to === currentUser);

        if (isForMe && callData.from !== currentUser && !activeCallId) {
          activeCallId = change.doc.id;
          isVideoCall = callData.isVideo;

          callModal.style.display = "flex";
          callTitle.textContent = `Incoming ${isVideoCall ? 'Video' : 'Voice'} Call from @${callData.from}`;
          callStatusText.textContent = "Ringing...";
          acceptCallBtn.style.display = "inline-block";

          acceptCallBtn.onclick = async () => {
            acceptCallBtn.style.display = "none";
            callStatusText.textContent = "Connecting...";

            try {
              localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
              localVideo.srcObject = localStream;
              if (isVideoCall) localVideo.classList.add("active"); else localVideo.classList.remove("active");

              const callRef = doc(db, "calls", activeCallId);
              const callSnap = await getDoc(callRef);
              const data = callSnap.data();

              let parts = data.participants || [];
              if (!parts.includes(currentUser)) parts.push(currentUser);
              await updateDoc(callRef, { participants: parts, status: "answered" });

              const caller = data.from;
              const pc = createPeerConnection(caller);
              pc.onicecandidate = e => { if (e.candidate) addDoc(collection(db, "calls", activeCallId, `candidates_${currentUser}_${caller}`), e.candidate.toJSON()); };

              await pc.setRemoteDescription(new RTCSessionDescription({ type: data.offers[caller].type, sdp: data.offers[caller].sdp }));
              const answerDescription = await pc.createAnswer();
              await pc.setLocalDescription(answerDescription);

              await updateDoc(callRef, { [`answers.${currentUser}`]: { type: answerDescription.type, sdp: answerDescription.sdp } });

              onSnapshot(collection(db, "calls", activeCallId, `candidates_${caller}_${currentUser}`), snapshot => {
                snapshot.docChanges().forEach(change => {
                  if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                });
              });

              callStatusText.textContent = "Connected";

              if (callDocUnsubscribe) callDocUnsubscribe();
              callDocUnsubscribe = onSnapshot(callRef, snap => {
                if (!snap.exists() || snap.data().status === "ended") hangUpCall(false);
              });
            } catch (e) {
              showAlert("Failed to accept call", true);
              hangUpCall(true);
            }
          };
        }
      }
    });
  });
}

function createPeerConnection(remoteUser) {
  const pc = new RTCPeerConnection(servers);
  peerConnections[remoteUser] = pc;

  const remoteStream = new MediaStream();
  remoteStreams[remoteUser] = remoteStream;

  let targetVideoEl = remoteVideo;
  if (Object.keys(peerConnections).length > 1) {
    targetVideoEl = document.createElement("video");
    targetVideoEl.autoplay = true;
    targetVideoEl.playsInline = true;
    targetVideoEl.className = "active";
    targetVideoEl.style.cssText = "width:100%; height:100%; object-fit:cover; background:#111; border-radius:8px;";
    videoGridContainer.appendChild(targetVideoEl);
  }
  targetVideoEl.srcObject = remoteStream;
  targetVideoEl.classList.add("active");

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  pc.ontrack = event => { event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track)); };
  return pc;
}

endCallBtn.onclick = () => hangUpCall(true);

async function hangUpCall(updateFirestore) {
  if (activeCallId && updateFirestore) {
    try { await updateDoc(doc(db, "calls", activeCallId), { status: "ended" }); } catch (e) {}
  }
  if (localStream) { stopMediaTracks(localStream); localStream = null; }
  
  Object.values(peerConnections).forEach(pc => pc.close());
  peerConnections = {};
  remoteStreams = {};

  if (callDocUnsubscribe) { callDocUnsubscribe(); callDocUnsubscribe = null; }

  localVideo.srcObject = null;
  remoteVideo.srcObject = null;
  localVideo.classList.remove("active");
  remoteVideo.classList.remove("active");

  const extraVideos = videoGridContainer.querySelectorAll("video:not(#remoteVideo):not(#localVideo)");
  extraVideos.forEach(v => v.remove());

  callModal.style.display = "none";
  activeCallId = null;
}

let scene, camera, renderer, particles;
function init3D() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById("canvas-container").appendChild(renderer.domElement);

  const geo = new THREE.BufferGeometry();
  const count = 1500;
  const pos = new Float32Array(count * 3);
  for(let i=0; i<count*3; i++) pos[i] = (Math.random() - 0.5) * 10;
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  
  const mat = new THREE.PointsMaterial({ color: 0x25d366, size: 0.02, transparent: true, opacity: 0.5 });
  particles = new THREE.Points(geo, mat);
  scene.add(particles);
  camera.position.z = 2;
}

function animate() {
  requestAnimationFrame(animate);
  particles.rotation.y += 0.001;
  particles.rotation.x += 0.0005;
  renderer.render(scene, camera);
}

window.onload = () => {
  init3D();
  animate();
};

window.onresize = () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
};
</script>
